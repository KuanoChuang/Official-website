<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pre-computed Protein Visualizer</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #030508; font-family: 'Segoe UI', Tahoma, sans-serif; }
    #root { width: 100vw; height: 100vh; }
    
    .ui-panel {
      position: absolute; top: 20px; right: 20px; z-index: 10;
      display: flex; flex-direction: column; gap: 10px; width: 280px;
      background: rgba(10, 15, 30, 0.7); padding: 25px; border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
    }
    .ui-panel h2 { color: #fff; margin: 0 0 15px 0; font-size: 16px; letter-spacing: 2px; }
    .phase-btn {
      background: rgba(255,255,255,0.05); color: #aaa; border: 1px solid rgba(255,255,255,0.1);
      padding: 14px 15px; border-radius: 8px; cursor: pointer;
      font-weight: 500; text-align: left; transition: all 0.2s; font-size: 14px;
    }
    .phase-btn:hover { background: rgba(0, 240, 255, 0.1); color: #fff; border-color: #00f0ff; }
    .phase-btn.active { 
      background: #00f0ff; color: #000; border-color: #00f0ff; 
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.5); font-weight: bold;
    }
    .loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #00f0ff; font-size: 20px; font-weight: 300; letter-spacing: 1px;
    }
  </style>

  <!-- 引入 React 與 Three.js -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "three": "https://esm.sh/three@0.150.0",
        "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.13.0?external=react,react-dom,three",
        "@react-three/drei": "https://esm.sh/@react-three/drei@9.70.0?external=react,react-dom,three,@react-three/fiber"
      }
    }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useRef, useState, useEffect, useMemo, Suspense } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Canvas, useFrame } from '@react-three/fiber';
    import { OrbitControls, Environment, ContactShadows, useGLTF } from '@react-three/drei';
    import * as THREE from 'three';

    function AtomView({ atoms, visible, opacity = 1.0 }) {
      const meshRef = useRef();
      const dummy = useMemo(() => new THREE.Object3D(), []);
      
      useEffect(() => {
        if (!meshRef.current || !atoms) return;
        atoms.forEach((atom, i) => {
          dummy.position.set(...atom.pos);
          dummy.scale.setScalar(atom.radius * 0.8); // 稍微縮小原子半徑以便觀察
          dummy.updateMatrix();
          meshRef.current.setMatrixAt(i, dummy.matrix);
          
          // 設定原子顏色 (CPK 標準配色)
          const color = new THREE.Color(
            atom.type === 'O' ? '#ff2222' : 
            atom.type === 'N' ? '#2255ff' : 
            atom.type === 'S' ? '#dddd00' : '#888888'
          );
          meshRef.current.setColorAt(i, color);
        });
        meshRef.current.instanceMatrix.needsUpdate = true;
        meshRef.current.instanceColor.needsUpdate = true;
      }, [atoms]);

      if (!visible) return null;

      return (
        <instancedMesh ref={meshRef} args={[null, null, atoms.length]}>
          <sphereGeometry args={[1, 16, 16]} />
          {/* 原子材質設定 */}
          <meshStandardMaterial 
            roughness={0.4} metalness={0.1} 
            transparent opacity={opacity} depthWrite={opacity === 1.0}
          />
        </instancedMesh>
      );
    }

    function SESView({ visible, mode }) {
      // 讀取我們產生的 GLB 模型 (React Three Fiber 會自動快取)
      const { nodes } = useGLTF('./protein_ses.glb');
      
      const geometry = useMemo(() => {
        if (!nodes) return null;
        // 自動尋找檔案中的立體網格 (Mesh)
        const mesh = Object.values(nodes).find(n => n.isMesh);
        return mesh ? mesh.geometry : null;
      }, [nodes]);

      if (!visible || !geometry) return null;

      return (
        <mesh geometry={geometry}>
          {mode === 'solid' ? (
            <meshStandardMaterial color="#e0e5ec" roughness={0.5} metalness={0.1} />
          ) : (
            <meshPhysicalMaterial 
              color="#ffffff" 
              transmission={0.8} // 玻璃透視感
              opacity={1} 
              transparent={true}
              roughness={0.2} 
              thickness={2.0} // 玻璃厚度折射
              ior={1.4} // 折射率
              side={THREE.DoubleSide}
            />
          )}
        </mesh>
      );
    }

    function PocketVoxels({ voxels, visible, isGlowing }) {
      const meshRef = useRef();
      const dummy = useMemo(() => new THREE.Object3D(), []);
      
      useEffect(() => {
        if (!meshRef.current || !voxels) return;
        voxels.forEach((pos, i) => {
          dummy.position.set(...pos);
          dummy.updateMatrix();
          meshRef.current.setMatrixAt(i, dummy.matrix);
        });
        meshRef.current.instanceMatrix.needsUpdate = true;
      }, [voxels]);

      if (!visible) return null;

      // 體素間距通常與 MRC voxel size 一致，這裡預設 1.0 作為方塊大小
      return (
        <instancedMesh ref={meshRef} args={[null, null, voxels.length]}>
          <boxGeometry args={[0.8, 0.8, 0.8]} />
          {isGlowing ? (
            <meshStandardMaterial 
              color="#00f0ff" emissive="#0088ff" emissiveIntensity={1.5} 
              transparent opacity={0.8}
            />
          ) : (
            <meshBasicMaterial color="#ffcc00" wireframe={true} transparent opacity={0.3} />
          )}
        </instancedMesh>
      );
    }

    function App() {
      const [data, setData] = useState(null);
      const [error, setError] = useState(null);
      const [phase, setPhase] = useState(1);

      useEffect(() => {
        // 載入我們 Python 轉檔好的單一檔案
        fetch('./precomputed_data.json')
          .then(res => {
            if (!res.ok) throw new Error(`無法讀取檔案 (HTTP ${res.status})。請確認 Python 產生的 json 已放對位置。`);
            return res.json();
          })
          .then(setData)
          .catch(err => setError(err.toString()));
      }, []);

      if (error) return <div className="loading" style={{color: '#ff4444'}}>載入失敗: {error}</div>;
      if (!data) return <div className="loading">載入預先計算資產中... (Loading JSON)</div>;

      return (
        <>
          <div className="ui-panel">
            <h2>RENDER PIPELINE</h2>
            <button className={`phase-btn ${phase === 1 ? 'active' : ''}`} onClick={() => setPhase(1)}>
              1. Atoms (分子球棒模型)
            </button>
            <button className={`phase-btn ${phase === 2 ? 'active' : ''}`} onClick={() => setPhase(2)}>
              2. SES Surface (實體表面)
            </button>
            <button className={`phase-btn ${phase === 3 ? 'active' : ''}`} onClick={() => setPhase(3)}>
              3. MRC Voxels (空腔掃描)
            </button>
            <button className={`phase-btn ${phase === 4 ? 'active' : ''}`} onClick={() => setPhase(4)}>
              4. Final Rendering (透視疊加)
            </button>
          </div>

          {/* 啟動高畫質反鋸齒與陰影 */}
          <Canvas camera={{ position: [0, 0, 45], fov: 40 }} shadows>
            <color attach="background" args={['#030508']} />
            
            {/* 攝影機控制器 */}
            <OrbitControls autoRotate={phase === 4} autoRotateSpeed={0.5} makeDefault />
            
            {/* 專業燈光設定 (Key, Fill, Back) */}
            <ambientLight intensity={0.5} />
            <directionalLight position={[20, 20, 20]} intensity={1.5} castShadow />
            <directionalLight position={[-20, 0, -20]} intensity={0.5} color="#00f0ff" />
            <pointLight position={[0, -20, 0]} intensity={1.0} color="#ff00ff" />
            
            {/* 環境反射光 (提供 SES 玻璃材質折射的依據) */}
            <Environment preset="city" />

            {}
            <Suspense fallback={null}>
              <group position={[0,0,0]}>
                {/* Phase 1: 僅顯示實體原子 */}
                <AtomView atoms={data.atoms} visible={phase === 1} />
                
                {/* Phase 2: 僅顯示實體 SES (GLB) */}
                <SESView visible={phase === 2} mode="solid" />
                
                {/* Phase 3: 幽靈原子 + 掃描體素線框 */}
                <AtomView atoms={data.atoms} visible={phase === 3} opacity={0.15} />
                <PocketVoxels voxels={data.pocket_voxels} visible={phase === 3} isGlowing={false} />
                
                {/* Phase 4: 終極組合 - 玻璃態 SES 包覆發光體素 */}
                <SESView visible={phase === 4} mode="glass" />
                <PocketVoxels voxels={data.pocket_voxels} visible={phase === 4} isGlowing={true} />
              </group>
            </Suspense>

          </Canvas>
        </>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
