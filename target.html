<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protein Pocket Algorithm Visualization</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "three": "https://esm.sh/three@0.150.1",
            "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.12.0?external=react,react-dom,three",
            "@react-three/drei": "https://esm.sh/@react-three/drei@9.58.0?external=react,react-dom,three,@react-three/fiber"
        }
    }
    </script>
    
    <script type="module" src="https://esm.sh/run"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #0d1117; color: white; font-family: 'Inter', sans-serif; }
        #root { width: 100vw; height: 100vh; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-active { background-color: #3b82f6; color: white; border-color: #60a5fa; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .btn-inactive { background-color: rgba(255,255,255,0.1); color: #9ca3af; border-color: transparent; transition: background-color 0.3s; }
        .btn-inactive:hover { background-color: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef, useMemo, Suspense } from 'react';
    import { createRoot } from 'react-dom/client';
    import * as THREE from 'three';
    import { Canvas, useFrame } from '@react-three/fiber';
    import { OrbitControls, useGLTF, Html } from '@react-three/drei';

    // 這個錯誤捕捉器將會在渲染失敗時，顯示具體錯誤，而不是死機黑屏
    class ErrorBoundary extends React.Component {
        constructor(props) {
            super(props);
            this.state = { hasError: false, error: null };
        }
        static getDerivedStateFromError(error) {
            return { hasError: true, error };
        }
        render() {
            if (this.state.hasError) {
                return (
                    <div className="flex h-screen w-screen items-center justify-center bg-red-900/80">
                        <div className="p-8 rounded-xl bg-red-950 text-red-200 border border-red-500 max-w-2xl shadow-2xl">
                            <h2 className="text-2xl font-bold mb-4">網頁渲染發生錯誤</h2>
                            <p className="mb-4 text-gray-300">防黑屏機制啟動，錯誤原因如下：</p>
                            <pre className="text-sm bg-black/50 p-4 rounded overflow-auto whitespace-pre-wrap">{this.state.error.toString()}</pre>
                        </div>
                    </div>
                );
            }
            return this.props.children;
        }
    }

    function AtomGroup({ type, atoms, color }) {
        const meshRef = useRef();
        useEffect(() => {
            if (!meshRef.current || !atoms || atoms.length === 0) return;
            const dummy = new THREE.Object3D();
            atoms.forEach((a, i) => {
                dummy.position.set(a.pos[0], a.pos[1], a.pos[2]);
                dummy.scale.setScalar(a.radius);
                dummy.updateMatrix();
                meshRef.current.setMatrixAt(i, dummy.matrix);
            });
            meshRef.current.instanceMatrix.needsUpdate = true;
        }, [atoms]);

        // 防護網：避免 WebGL 因為 0 個實例而崩潰
        if (!atoms || atoms.length === 0) return null;

        return (
            <instancedMesh ref={meshRef} args={[null, null, atoms.length]}>
                <sphereGeometry args={[1, 32, 32]} />
                <meshStandardMaterial color={color} roughness={0.4} metalness={0.1} />
            </instancedMesh>
        );
    }

    function InstancedAtoms({ atoms, visible }) {
        if (!visible || !atoms || atoms.length === 0) return null;
        const groups = useMemo(() => {
            const grp = {};
            atoms.forEach(a => {
                const type = a.type || 'C';
                if (!grp[type]) grp[type] = [];
                grp[type].push(a);
            });
            return grp;
        }, [atoms]);

        const colorMap = { C: '#aaaaaa', N: '#3333ff', O: '#ff3333', S: '#ffff33', P: '#ffa500', H: '#ffffff' };

        return (
            <group>
                {Object.entries(groups).map(([type, atomList]) => (
                    <AtomGroup key={type} type={type} atoms={atomList} color={colorMap[type] || '#ff00ff'} />
                ))}
            </group>
        );
    }

    function SESView({ visible }) {
        // 使用 try-catch 的概念，若找不到 SES 模型不會當機
        const { scene } = useGLTF('./protein_ses.glb', true, true, (loader) => {
            loader.manager.onError = (url) => {
                console.error("找不到模型:", url);
            };
        });
        
        useMemo(() => {
            if(!scene) return;
            scene.traverse((child) => {
                if (child.isMesh) {
                    if (!child.geometry.attributes.normal) {
                        child.geometry.computeVertexNormals();
                    }
                    child.material = new THREE.MeshPhysicalMaterial({
                        color: '#aaddff',
                        transmission: 0.9,     
                        opacity: 1,
                        metalness: 0.1,
                        roughness: 0.1,
                        clearcoat: 1.0,        
                        clearcoatRoughness: 0.1,
                        ior: 1.4,              
                        transparent: true,
                        side: THREE.DoubleSide
                    });
                }
            });
        }, [scene]);

        if (!visible) return null;
        return <primitive object={scene} />;
    }

    function GridWireframe({ algoData, visible }) {
        if (!visible || !algoData || !algoData.grid) return null;
        const { sizeX, sizeY, sizeZ } = algoData.grid;
        
        return (
            <mesh>
                <boxGeometry args={[sizeX, sizeY, sizeZ]} />
                <meshBasicMaterial color="#00ffcc" wireframe={true} transparent opacity={0.2} />
            </mesh>
        );
    }

    function VoxelGroup({ positions, color, spacing, clipPlane, opacity = 1, visible }) {
        const meshRef = useRef();
        
        useEffect(() => {
            if (!meshRef.current || !positions || positions.length === 0) return;
            const dummy = new THREE.Object3D();
            positions.forEach((pos, i) => {
                dummy.position.set(pos[0], pos[1], pos[2]);
                dummy.updateMatrix();
                meshRef.current.setMatrixAt(i, dummy.matrix);
            });
            meshRef.current.instanceMatrix.needsUpdate = true;
        }, [positions]);

        if (!visible || !positions || positions.length === 0) return null;

        return (
            <instancedMesh ref={meshRef} args={[null, null, positions.length]}>
                <boxGeometry args={[spacing * 0.85, spacing * 0.85, spacing * 0.85]} />
                <meshLambertMaterial 
                    color={color} 
                    transparent={opacity < 1} 
                    opacity={opacity} 
                    clippingPlanes={[clipPlane]} 
                    clipShadows={true} 
                    side={THREE.DoubleSide}
                />
            </instancedMesh>
        );
    }

    function VoxelScanner({ algoData, visible }) {
        const clipPlane = useMemo(() => new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0), []);
        
        useFrame(({ clock }) => {
            if (!visible || !algoData || !algoData.grid) return;
            const max = algoData.grid.sizeX / 2 + 2; // 使用真實長度計算掃描距離
            const min = -max;
            const duration = 5; 
            const progress = (clock.getElapsedTime() % duration) / duration;
            clipPlane.constant = min + progress * (max - min);
        });

        if (!visible || !algoData || !algoData.voxels) return null;

        const { solvent, protein, cavity } = algoData.voxels;
        const { spacing } = algoData.grid;

        return (
            <group>
                <VoxelGroup positions={solvent} color="#0088ff" spacing={spacing} clipPlane={clipPlane} opacity={0.15} visible={true} />
                <VoxelGroup positions={protein} color="#ffffff" spacing={spacing} clipPlane={clipPlane} opacity={0.3} visible={true} />
                <VoxelGroup positions={cavity} color="#ff0077" spacing={spacing} clipPlane={clipPlane} opacity={1.0} visible={true} />
            </group>
        );
    }

    function App() {
        const [data, setData] = useState(null);
        const [phase, setPhase] = useState(1);
        const [phase1Opts, setPhase1Opts] = useState({ vdw: true, ses: true });
        const [error, setError] = useState(null);

        useEffect(() => {
            fetch('./precomputed_data.json')
                .then(res => {
                    if (!res.ok) throw new Error("找不到 precomputed_data.json");
                    return res.json();
                })
                .then(setData)
                .catch(err => setError(err.message));
        }, []);

        if (error) {
            return (
                <div className="flex h-screen w-screen items-center justify-center bg-red-900/50">
                    <div className="p-8 rounded-xl bg-red-950 text-red-200 border border-red-500 shadow-2xl">
                        <h2 className="text-2xl font-bold mb-4">資料載入失敗</h2>
                        <p>{error}</p>
                        <p className="mt-4 text-sm text-red-300">請確認 Python 腳本已執行，且檔案放在伺服器同一個目錄中。</p>
                    </div>
                </div>
            );
        }

        if (!data) {
            return <div className="flex h-screen items-center justify-center text-xl animate-pulse">載入 JSON 數據中...</div>;
        }

        const showAtoms = (phase === 1 && phase1Opts.vdw) || phase === 2 || phase === 3;
        const showSES = (phase === 1 && phase1Opts.ses);
        const showGrid = phase === 2;
        const showScanner = phase === 3;

        return (
            <ErrorBoundary>
                <Canvas gl={{ localClippingEnabled: true, antialias: true }} camera={{ position: [0, 0, 40], fov: 45 }}>
                    <color attach="background" args={['#0d1117']} />
                    
                    <ambientLight intensity={1.5} />
                    <directionalLight position={[10, 20, 10]} intensity={2.0} />
                    <pointLight position={[-10, -10, -10]} intensity={1.0} color="#ffffff" />

                    <Suspense fallback={<Html center><div className="text-blue-400 font-bold w-48 text-center bg-black/60 p-3 rounded">模型載入中...</div></Html>}>
                        <InstancedAtoms atoms={data.atoms} visible={showAtoms} />
                        <SESView visible={showSES} />
                        <GridWireframe algoData={data.algo_data} visible={showGrid} />
                        <VoxelScanner algoData={data.algo_data} visible={showScanner} />
                    </Suspense>

                    <OrbitControls makeDefault autoRotate={phase === 1} autoRotateSpeed={0.5} enableDamping />
                </Canvas>

                {/* 按鈕介面 */}
                <div className="absolute top-6 left-1/2 transform -translate-x-1/2 flex gap-3 p-2 glass-panel rounded-full z-10 shadow-2xl">
                    {[1, 2, 3].map(p => (
                        <button
                            key={p}
                            onClick={() => setPhase(p)}
                            className={`px-6 py-2 rounded-full font-bold transition-all duration-300 ${phase === p ? 'btn-active' : 'btn-inactive'}`}
                        >
                            Phase {p}
                        </button>
                    ))}
                </div>

                {/* Phase 1 專屬選項 */}
                {phase === 1 && (
                    <div className="absolute bottom-10 left-1/2 transform -translate-x-1/2 glass-panel p-4 rounded-xl flex gap-6 z-10 border border-gray-600 shadow-xl">
                        <label className="flex items-center gap-3 cursor-pointer text-lg">
                            <input 
                                type="checkbox" 
                                className="w-5 h-5 accent-blue-500 cursor-pointer"
                                checked={phase1Opts.vdw}
                                onChange={(e) => setPhase1Opts({...phase1Opts, vdw: e.target.checked})}
                            />
                            VDW 實心原子
                        </label>
                        <label className="flex items-center gap-3 cursor-pointer text-lg">
                            <input 
                                type="checkbox" 
                                className="w-5 h-5 accent-blue-500 cursor-pointer"
                                checked={phase1Opts.ses}
                                onChange={(e) => setPhase1Opts({...phase1Opts, ses: e.target.checked})}
                            />
                            SES 半透明表面
                        </label>
                    </div>
                )}

                {/* 說明面板 */}
                <div className="absolute bottom-6 right-6 p-6 glass-panel rounded-xl max-w-sm border border-gray-700 pointer-events-none">
                    <h3 className="text-xl font-bold mb-2 text-white">
                        {phase === 1 && "受體結構與表面"}
                        {phase === 2 && "長方體空間網格化 (Voxelization)"}
                        {phase === 3 && "空腔切面掃描 (Ray-casting)"}
                    </h3>
                    <p className="text-sm text-gray-300 leading-relaxed">
                        {phase === 1 && "展示蛋白質原子 (VDW) 以及高度透光的溶劑排除表面 (SES)。"}
                        {phase === 2 && "基於真實 MRC 計算尺寸，生成緊密包覆蛋白質實體的長方體網格空間。"}
                        {phase === 3 && "保留底層原子，以距離場裁切面從左至右掃描。淡藍色：溶劑區。白色：蛋白質。發光粉紅：空腔口袋區。"}
                    </p>
                </div>
            </ErrorBoundary>
        );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
    </script>
</body>
</html>
