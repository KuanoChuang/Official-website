<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pre-computed Protein Visualizer</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #030508; font-family: 'Segoe UI', Tahoma, sans-serif; }
    #root { width: 100vw; height: 100vh; }
    
    .ui-panel {
      position: absolute; top: 20px; right: 20px; z-index: 10;
      display: flex; flex-direction: column; gap: 8px; width: 320px;
      background: rgba(10, 15, 30, 0.85); padding: 25px; border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      backdrop-filter: blur(12px);
    }
    .ui-panel h2 { color: #fff; margin: 0 0 10px 0; font-size: 15px; letter-spacing: 2px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px;}
    .phase-btn {
      background: rgba(255,255,255,0.05); color: #aaa; border: 1px solid rgba(255,255,255,0.1);
      padding: 12px 15px; border-radius: 8px; cursor: pointer;
      font-weight: 500; text-align: left; transition: all 0.2s; font-size: 13px;
    }
    .phase-btn:hover { background: rgba(0, 240, 255, 0.1); color: #fff; border-color: #00f0ff; }
    .phase-btn.active { 
      background: #00f0ff; color: #000; border-color: #00f0ff; 
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); font-weight: bold;
    }
    
    .sub-options { display: flex; gap: 10px; margin-top: 5px; margin-bottom: 5px; }
    .sub-btn { 
      flex: 1; padding: 6px; font-size: 11px; background: rgba(255,255,255,0.1); 
      border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 4px; cursor: pointer;
    }
    .sub-btn:hover { background: rgba(255, 0, 119, 0.3); }
    .sub-btn.active { background: #ff0077; border-color: #ff0077; font-weight: bold;}
    
    .loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #00f0ff; font-size: 20px; font-weight: 300; letter-spacing: 1px;
    }
    
    .legend {
      position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7);
      padding: 15px; border-radius: 10px; color: #fff; font-size: 12px; display: flex; flex-direction: column; gap: 5px;
    }
    .legend-item { display: flex; align-items: center; gap: 10px; }
    .color-box { width: 15px; height: 15px; border-radius: 3px; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "three": "https://esm.sh/three@0.150.0",
        "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.13.0?external=react,react-dom,three",
        "@react-three/drei": "https://esm.sh/@react-three/drei@9.70.0?external=react,react-dom,three,@react-three/fiber"
      }
    }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useRef, useState, useEffect, useLayoutEffect, useMemo, Suspense } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Canvas, useFrame } from '@react-three/fiber';
    import { OrbitControls, useGLTF } from '@react-three/drei';
    import * as THREE from 'three';

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -50%)', color: '#ff4444', backgroundColor: 'rgba(0,0,0,0.9)', padding: '30px', borderRadius: '10px', zIndex: 100, border: '1px solid #ff4444' }}>
              <h3>渲染崩潰 (Crash)</h3>
              <pre style={{ whiteSpace: 'pre-wrap', fontSize: '12px' }}>{this.state.error.message}</pre>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // 計算合身邊界 (共用邏輯)
    function computeTightBounds(atoms, padding = 2.0) {
       if (!atoms || atoms.length === 0) return { sizeX: 20, sizeY: 20, sizeZ: 20, cx: 0, cy: 0, cz: 0 };
       let minX = 9999, minY = 9999, minZ = 9999;
       let maxX = -9999, maxY = -9999, maxZ = -9999;
       atoms.forEach(a => {
          const r = a.radius || 1.5;
          minX = Math.min(minX, a.pos[0] - r);
          minY = Math.min(minY, a.pos[1] - r);
          minZ = Math.min(minZ, a.pos[2] - r);
          maxX = Math.max(maxX, a.pos[0] + r);
          maxY = Math.max(maxY, a.pos[1] + r);
          maxZ = Math.max(maxZ, a.pos[2] + r);
       });
       const sizeX = (maxX - minX) + padding * 2;
       const sizeY = (maxY - minY) + padding * 2;
       const sizeZ = (maxZ - minZ) + padding * 2;
       const cx = (maxX + minX) / 2;
       const cy = (maxY + minY) / 2;
       const cz = (maxZ + minZ) / 2;
       return { sizeX, sizeY, sizeZ, cx, cy, cz };
    }

    // Phase 1, 2, 3: 實體原子渲染
    function AtomView({ atoms, visible, opacity = 1.0 }) {
      const meshRef = useRef();
      const dummy = useMemo(() => new THREE.Object3D(), []);
      
      // 使用 useLayoutEffect 解決「剛載入時全白無色」的閃爍問題，並且套用完美色彩對應
      useLayoutEffect(() => {
        if (!meshRef.current || !atoms || atoms.length === 0) return;
        atoms.forEach((atom, i) => {
          dummy.position.set(...atom.pos);
          dummy.scale.setScalar(atom.radius * 0.9);
          dummy.updateMatrix();
          meshRef.current.setMatrixAt(i, dummy.matrix);
          
          let hexColor = '#888888';
          const type = atom.type ? atom.type.toUpperCase() : '';
          
          if (type === 'O') hexColor = '#ff3333';      // 氧: 鮮紅
          else if (type === 'N') hexColor = '#3333ff'; // 氮: 鮮藍
          else if (type === 'S') hexColor = '#ffcc33'; // 硫: 亮黃
          else if (type === 'H') hexColor = '#ffffff'; // 氫: 純白
          else if (type === 'C') hexColor = '#33ff33'; // 碳: 亮綠
          
          const color = new THREE.Color(hexColor);
          meshRef.current.setColorAt(i, color);
        });
        meshRef.current.instanceMatrix.needsUpdate = true;
        if (meshRef.current.instanceColor) meshRef.current.instanceColor.needsUpdate = true;
      }, [atoms, visible]);

      if (!visible || !atoms || atoms.length === 0) return null;

      return (
        <instancedMesh ref={meshRef} args={[null, null, atoms.length]}>
          <sphereGeometry args={[1, 16, 16]} />
          <meshStandardMaterial 
            roughness={0.4} metalness={0.2} 
            transparent opacity={opacity} depthWrite={opacity === 1.0}
          />
        </instancedMesh>
      );
    }

    // Phase 1 & 6: SES 半透明膜渲染 (超強包覆感與邊緣漸層)
    function SESView({ visible }) {
      const gltf = useGLTF('./protein_ses.glb');
      const geometry = useMemo(() => {
        if (!gltf.nodes) return null;
        const meshNode = Object.values(gltf.nodes).find(n => n.isMesh);
        if (meshNode && meshNode.geometry) {
          const geo = meshNode.geometry.clone();
          geo.computeVertexNormals();
          return geo;
        }
        return null;
      }, [gltf]);

      if (!visible || !geometry) return null;

      return (
        <mesh geometry={geometry}>
          <meshPhysicalMaterial 
            color="#e6f0ff"           
            transmission={0.95}       /* 極高透光率，看透內部原子 */
            opacity={1.0}             /* 必須為 1.0 才能啟動物理折射運算 */
            transparent={true}
            roughness={0.08}          /* 光滑濕潤感 */
            thickness={6.0}           /* 大幅增加物理厚度，創造包裹感 */
            ior={1.6}                 /* 高折射率，透鏡彎曲邊緣 */
            clearcoat={1.0}           /* 表面反光塗層 */
            clearcoatRoughness={0.05} 
            attenuationColor="#0033cc"/* 邊緣深藍色，創造立體細胞膜漸層感 */
            attenuationDistance={5.0} /* 讓吸收範圍變短，強化邊緣輪廓 */
            depthWrite={false}        /* 關閉深度寫入，完美呈現內部實體不被遮擋 */
            side={THREE.DoubleSide}
          />
        </mesh>
      );
    }

    // 自訂的完美正方格平面網格
    function CustomGridPlane({ width, height, spacing, color }) {
      const geometry = useMemo(() => {
        const points = [];
        const halfW = width / 2;
        const halfH = height / 2;
        
        const numW = Math.floor(width / spacing);
        const numH = Math.floor(height / spacing);
        const startX = -(numW * spacing) / 2;
        const startY = -(numH * spacing) / 2;
        
        for (let i = 0; i <= numW; i++) {
          const x = startX + i * spacing;
          points.push(new THREE.Vector3(x, 0, -halfH));
          points.push(new THREE.Vector3(x, 0, halfH));
        }
        for (let i = 0; i <= numH; i++) {
          const y = startY + i * spacing;
          points.push(new THREE.Vector3(-halfW, 0, y));
          points.push(new THREE.Vector3(halfW, 0, y));
        }
        return new THREE.BufferGeometry().setFromPoints(points);
      }, [width, height, spacing]);

      return (
        <lineSegments geometry={geometry}>
          <lineBasicMaterial color={color} transparent opacity={0.3} />
        </lineSegments>
      );
    }

    // Phase 2: 長方體合身網格線框架
    function GridWireframe({ algoData, atoms, visible }) {
      const bounds = useMemo(() => computeTightBounds(atoms, 2.0), [atoms]);
      const boxGeo = useMemo(() => new THREE.BoxGeometry(bounds.sizeX, bounds.sizeY, bounds.sizeZ), [bounds]);

      if (!visible || !algoData) return null;
      const { spacing = 1 } = algoData.grid;

      return (
        <group position={[bounds.cx, bounds.cy, bounds.cz]}>
          <boxHelper args={[new THREE.Mesh(boxGeo)]} color="#00f0ff" />
          <group position={[0, -bounds.sizeY/2, 0]}>
             <CustomGridPlane width={bounds.sizeX} height={bounds.sizeZ} spacing={spacing} color="#00f0ff" />
          </group>
          <group position={[0, 0, -bounds.sizeZ/2]} rotation={[Math.PI/2, 0, 0]}>
             <CustomGridPlane width={bounds.sizeX} height={bounds.sizeY} spacing={spacing} color="#00f0ff" />
          </group>
        </group>
      );
    }

    // Phase 3, 4, 5: 網格動畫掃描器
    function AlgorithmScanner({ algoData, atoms, phase }) {
      const { grid, voxels } = algoData;
      const { protein = [], solvent = [], cavity = [], probe = [] } = voxels;
      
      const bounds = useMemo(() => computeTightBounds(atoms, 2.0), [atoms]);
      
      const pRef = useRef(); const sRef = useRef(); 
      const cRef = useRef(); const prRef = useRef();
      const dummy = useMemo(() => new THREE.Object3D(), []);
      
      const timeRef = useRef(0);
      
      useFrame((state, delta) => {
        if (phase < 3 || phase > 5) return;
        timeRef.current += delta;
        
        // Phase 3: X 軸單向掃描 (掃過後保留半透明方塊並上色)
        if (phase === 3) {
          const cycleTime = 4.0;
          const progress = (timeRef.current % cycleTime) / cycleTime;
          // 動態貼合真實 Bounding Box，不浪費動畫時間在空白處
          const scanPos = (bounds.cx - bounds.sizeX/2) + (progress * bounds.sizeX);
          
          const updateRetainScan = (ref, pts, baseColor, isCavity) => {
             if (!ref.current || pts.length === 0) return;
             if (ref.current.count === 0) ref.current.count = pts.length;

             pts.forEach((pt, i) => {
               const isScanned = pt[0] <= scanPos;
               const isScanning = Math.abs(pt[0] - scanPos) < (grid.spacing * 1.5);
               
               let s = 0.0;
               if (isScanning) s = 0.9;      
               else if (isScanned) s = isCavity ? 0.8 : 0.4;  // 口袋更實體一點

               dummy.position.set(...pt);
               dummy.scale.setScalar(s);
               dummy.updateMatrix();
               ref.current.setMatrixAt(i, dummy.matrix);
               
               if (ref.current.instanceColor) {
                  const color = new THREE.Color(baseColor);
                  if (isScanning) color.lerp(new THREE.Color('#ffffff'), 0.8);
                  ref.current.setColorAt(i, color);
               }
             });
             ref.current.instanceMatrix.needsUpdate = true;
             if (ref.current.instanceColor) ref.current.instanceColor.needsUpdate = true;
          };

          updateRetainScan(pRef, protein, '#aaaaaa', false); // 蛋白區 灰色
          updateRetainScan(sRef, solvent, '#0055ff', false); // 溶劑區 藍色
          updateRetainScan(cRef, cavity, '#ffaa00', true);   // 空腔區 橘黃色
          if (prRef.current) prRef.current.count = 0; 
        }
        
        // Phase 4: Z 軸探針侵蝕掃描
        if (phase === 4) {
          const cycleTime = 3.0;
          const progress = (timeRef.current % cycleTime) / cycleTime;
          const scanZ = (bounds.cz - bounds.sizeZ/2) + (progress * bounds.sizeZ);
          
          if(pRef.current) pRef.current.count = 0;
          if(sRef.current) sRef.current.count = 0;
          if(cRef.current) cRef.current.count = cavity.length;
          if(prRef.current) prRef.current.count = probe.length;
          
          const updateFadeScan = (ref, pts, isProbe) => {
             if (!ref.current || pts.length === 0) return;
             pts.forEach((pt, i) => {
               const dz = scanZ - pt[2];
               let s = 0;
               if (dz > 0 && dz < 4.0) s = isProbe ? 0.8 : 0.4;
               else if (Math.abs(dz) <= grid.spacing) s = 1.0;
               
               dummy.position.set(...pt);
               dummy.scale.setScalar(s);
               dummy.updateMatrix();
               ref.current.setMatrixAt(i, dummy.matrix);
               
               if (ref.current.instanceColor) {
                  const baseColor = isProbe ? new THREE.Color('#00ff00') : new THREE.Color('#ffaa00');
                  const fade = Math.max(0.1, 1.0 - (dz / 4.0));
                  ref.current.setColorAt(i, dz > grid.spacing ? baseColor.multiplyScalar(fade) : baseColor);
               }
             });
             ref.current.instanceMatrix.needsUpdate = true;
             if (ref.current.instanceColor) ref.current.instanceColor.needsUpdate = true;
          };
          updateFadeScan(cRef, cavity, false);
          updateFadeScan(prRef, probe, true);
        }
        
        // Phase 5: 聯集探針可行區
        if (phase === 5) {
          if(pRef.current) pRef.current.count = 0;
          if(sRef.current) sRef.current.count = 0;
          if(cRef.current) cRef.current.count = 0;
          if(prRef.current && probe.length > 0) {
            prRef.current.count = probe.length;
            const color = new THREE.Color('#00ff00');
            probe.forEach((pt, i) => {
               dummy.position.set(...pt);
               dummy.scale.setScalar(0.9);
               dummy.updateMatrix();
               prRef.current.setMatrixAt(i, dummy.matrix);
               prRef.current.setColorAt(i, color);
            });
            prRef.current.instanceMatrix.needsUpdate = true;
            prRef.current.instanceColor.needsUpdate = true;
          }
        }
      });
      
      const geo = <boxGeometry args={[grid.spacing, grid.spacing, grid.spacing]} />;
      const mat = <meshBasicMaterial transparent opacity={0.65} />;
      
      return (
        <group visible={phase >= 3 && phase <= 5}>
          {protein.length > 0 && <instancedMesh ref={pRef} args={[null, null, protein.length]}>{geo}{mat}</instancedMesh>}
          {solvent.length > 0 && <instancedMesh ref={sRef} args={[null, null, solvent.length]}>{geo}{mat}</instancedMesh>}
          {cavity.length > 0 && <instancedMesh ref={cRef} args={[null, null, cavity.length]}>{geo}{mat}</instancedMesh>}
          {probe.length > 0 && <instancedMesh ref={prRef} args={[null, null, probe.length]}>{geo}<meshBasicMaterial transparent opacity={0.9} /></instancedMesh>}
        </group>
      );
    }

    // Phase 6: 口袋平滑 Mesh
    function PocketMesh({ meshData, visible }) {
      const geometry = useMemo(() => {
        if (!meshData || !meshData.vertices || meshData.vertices.length === 0) return null;
        const geo = new THREE.BufferGeometry();
        const verts = new Float32Array(meshData.vertices.flat());
        const indices = new Uint16Array(meshData.faces.flat());
        geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
        geo.setIndex(new THREE.BufferAttribute(indices, 1));
        geo.computeVertexNormals();
        return geo;
      }, [meshData]);

      if (!visible || !geometry) return null;

      return (
        <mesh geometry={geometry}>
          <meshPhysicalMaterial 
            color="#00ffcc" transmission={0.6} opacity={1} transparent={true}
            roughness={0.2} thickness={1.5} emissive="#004433" side={THREE.DoubleSide}
          />
        </mesh>
      );
    }

    function App() {
      const [data, setData] = useState(null);
      const [error, setError] = useState(null);
      const [phase, setPhase] = useState(1);
      const [phase1Opts, setPhase1Opts] = useState({ vdw: true, ses: true });

      useEffect(() => {
        fetch('./precomputed_data.json')
          .then(res => {
            if (!res.ok) throw new Error(`找不到 precomputed_data.json`);
            return res.json();
          })
          .then(setData)
          .catch(err => setError(err.toString()));
      }, []);

      if (error) return <div className="loading" style={{color: '#ff4444'}}>載入失敗: {error}</div>;
      if (!data) return <div className="loading">載入預先計算資產中...</div>;

      return (
        <ErrorBoundary>
          <div className="ui-panel">
            <h2>POCKET ALGORITHM PIPELINE</h2>
            
            <button className={`phase-btn ${phase === 1 ? 'active' : ''}`} onClick={() => setPhase(1)}>
              Phase 1: 結構視覺化
            </button>
            {phase === 1 && (
              <div className="sub-options">
                <button className={`sub-btn ${phase1Opts.vdw ? 'active' : ''}`} onClick={() => setPhase1Opts(p => ({...p, vdw: !p.vdw}))}>VDW 原子</button>
                <button className={`sub-btn ${phase1Opts.ses ? 'active' : ''}`} onClick={() => setPhase1Opts(p => ({...p, ses: !p.ses}))}>SES 表面</button>
              </div>
            )}
            
            <button className={`phase-btn ${phase === 2 ? 'active' : ''}`} onClick={() => setPhase(2)}>
              Phase 2: 空間網格化 (Voxelization)
            </button>
            <button className={`phase-btn ${phase === 3 ? 'active' : ''}`} onClick={() => setPhase(3)}>
              Phase 3: 距離場切面掃描 (保留塗色)
            </button>
            <button className={`phase-btn ${phase === 4 ? 'active' : ''}`} onClick={() => setPhase(4)}>
              Phase 4: 探針球侵蝕掃描
            </button>
            <button className={`phase-btn ${phase === 5 ? 'active' : ''}`} onClick={() => setPhase(5)}>
              Phase 5: 聯集探針可行區
            </button>
            <button className={`phase-btn ${phase === 6 ? 'active' : ''}`} onClick={() => setPhase(6)}>
              Phase 6: 表面平滑化 (Pocket Mesh)
            </button>
          </div>
          
          {phase >= 3 && phase <= 5 && (
             <div className="legend">
               <div className="legend-item"><div className="color-box" style={{background: '#0055ff'}}></div> 溶劑區 (Solvent)</div>
               <div className="legend-item"><div className="color-box" style={{background: '#aaaaaa'}}></div> 蛋白區 (Protein)</div>
               <div className="legend-item"><div className="color-box" style={{background: '#ffaa00'}}></div> 空腔區 (Cavity)</div>
               {phase >= 4 && <div className="legend-item"><div className="color-box" style={{background: '#00ff00', boxShadow: '0 0 10px #00ff00'}}></div> 探針區 (Probe Valid)</div>}
             </div>
          )}

          <Canvas camera={{ position: [0, 0, 35], fov: 45 }}>
            <color attach="background" args={['#030508']} />
            <OrbitControls autoRotate={phase === 6 || phase === 1} autoRotateSpeed={0.5} makeDefault />
            
            <ambientLight intensity={2.0} />
            <directionalLight position={[20, 20, 20]} intensity={3.0} />
            <directionalLight position={[-20, -10, -20]} intensity={1.5} color="#00f0ff" />
            <pointLight position={[0, 20, 0]} intensity={2.5} color="#ffffff" />
            
            <Suspense fallback={null}>
              <group position={[0,0,0]}>
                
                {/* Phase 1: 實體/透明雙模式 & Phase 2, 3: 背景半透明原子 */}
                <AtomView 
                  atoms={data.atoms} 
                  visible={(phase === 1 && phase1Opts.vdw) || phase === 2 || phase === 3} 
                  opacity={(phase === 2 || phase === 3) ? 0.2 : 1.0} 
                />
                <SESView visible={phase === 1 && phase1Opts.ses} />
                
                {/* Phase 2: 長方體完美合身網格 */}
                <GridWireframe algoData={data.algo_data} atoms={data.atoms} visible={phase === 2} />
                
                {/* Phase 3, 4, 5: 動畫掃描器 (動態綁定合身邊界框進行掃描) */}
                <AlgorithmScanner algoData={data.algo_data} atoms={data.atoms} phase={phase} />
                
                {/* Phase 6: 口袋 Mesh 呈現 */}
                <PocketMesh meshData={data.algo_data.pocket_mesh} visible={phase === 6} />
                <SESView visible={phase === 6} /> 
                
              </group>
            </Suspense>
          </Canvas>
        </ErrorBoundary>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
