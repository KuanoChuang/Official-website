<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Scanner Visualizer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030508;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        #root {
            width: 100vw;
            height: 100vh;
        }

        .ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 320px;
            background: rgba(10, 15, 30, 0.85);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
        }

        .ui-panel h2 {
            color: #fff;
            margin: 0 0 10px 0;
            font-size: 15px;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
        }

        .phase-btn {
            background: rgba(255, 255, 255, 0.05);
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            text-align: left;
            transition: all 0.2s;
            font-size: 13px;
        }

        .phase-btn:hover {
            background: rgba(0, 240, 255, 0.1);
            color: #fff;
            border-color: #00f0ff;
        }

        .phase-btn.active {
            background: #00f0ff;
            color: #000;
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            font-weight: bold;
        }

        .sub-options {
            display: flex;
            gap: 10px;
            margin-top: 5px;
            margin-bottom: 5px;
        }

        .sub-btn {
            flex: 1;
            padding: 6px;
            font-size: 11px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }

        .sub-btn:hover {
            background: rgba(255, 0, 119, 0.3);
        }

        .sub-btn.active {
            background: #ff0077;
            border-color: #ff0077;
            font-weight: bold;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00f0ff;
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: #fff;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-box {
            width: 15px;
            height: 15px;
            border-radius: 3px;
        }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "three": "https://esm.sh/three@0.150.0",
        "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.13.0?external=react,react-dom,three",
        "@react-three/drei": "https://esm.sh/@react-three/drei@9.70.0?external=react,react-dom,three,@react-three/fiber"
      }
    }
  </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel" data-type="module">
        import React, { useRef, useState, useEffect, useLayoutEffect, useMemo, Suspense } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Canvas, useFrame } from '@react-three/fiber';
        import { OrbitControls, useGLTF } from '@react-three/drei';
        import * as THREE from 'three';

        class Boundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div style={{ position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -50%)', color: '#ff4444', backgroundColor: 'rgba(0,0,0,0.9)', padding: '30px', borderRadius: '10px', zIndex: 100, border: '1px solid #ff4444' }}>
                            <h3>渲染崩潰</h3>
                            <pre style={{ whiteSpace: 'pre-wrap', fontSize: '12px' }}>{this.state.error.message}</pre>
                        </div>
                    );
                }
                return this.props.children;
            }
        }
        // 計算box邊界
        function computeTightBounds(atoms, padding = 2.0) {
            if (!atoms || atoms.length === 0) return { sizeX: 20, sizeY: 20, sizeZ: 20, cx: 0, cy: 0, cz: 0 };
            let minX = 9999, minY = 9999, minZ = 9999;
            let maxX = -9999, maxY = -9999, maxZ = -9999;
            atoms.forEach(a => {
                const r = a.radius || 1.5;
                minX = Math.min(minX, a.pos[0] - r);
                minY = Math.min(minY, a.pos[1] - r);
                minZ = Math.min(minZ, a.pos[2] - r);
                maxX = Math.max(maxX, a.pos[0] + r);
                maxY = Math.max(maxY, a.pos[1] + r);
                maxZ = Math.max(maxZ, a.pos[2] + r);
            });
            const sizeX = (maxX - minX) + padding * 2;
            const sizeY = (maxY - minY) + padding * 2;
            const sizeZ = (maxZ - minZ) + padding * 2;
            const cx = (maxX + minX) / 2;
            const cy = (maxY + minY) / 2;
            const cz = (maxZ + minZ) / 2;
            return { sizeX, sizeY, sizeZ, cx, cy, cz };
        }

        // Phase 1, 2, 3: 實體原子渲染
        function AtomView({ atoms, visible, dimmed = false }) {
            const meshRef = useRef();
            const dummy = useMemo(() => new THREE.Object3D(), []);
            useLayoutEffect(() => {
                if (!meshRef.current || !atoms || atoms.length === 0) return;
                atoms.forEach((atom, i) => {
                    dummy.position.set(...atom.pos);
                    dummy.scale.setScalar(atom.radius * 0.9);
                    dummy.updateMatrix();
                    meshRef.current.setMatrixAt(i, dummy.matrix);

                    let hexColor = '#cccccc'; // 預設顏色
                    if (atom.type === 'O') hexColor = '#ff3333';
                    else if (atom.type === 'N') hexColor = '#3333ff';
                    else if (atom.type === 'S') hexColor = '#ffcc33';
                    else if (atom.type === 'H') hexColor = '#ffffff';
                    else if (atom.type === 'C') hexColor = '#33ff33';

                    const color = new THREE.Color(hexColor);
                    color.multiplyScalar(0.4);
                    meshRef.current.setColorAt(i, color);
                });
                meshRef.current.instanceMatrix.needsUpdate = true;
                if (meshRef.current.instanceColor) meshRef.current.instanceColor.needsUpdate = true;
            }, [atoms, visible]);

            if (!visible || !atoms || atoms.length === 0) return null;
            return (
                <instancedMesh ref={meshRef} args={[null, null, atoms.length]}>
                    <sphereGeometry args={[1, 16, 16]} />
                    {!dimmed ? (
                        <meshPhongMaterial
                            shininess={30}
                            specular="#444444"
                            transparent={false}
                            opacity={1.0}
                            depthWrite={true}
                        />
                    ) : (
                        <meshBasicMaterial
                            transparent={true}
                            opacity={0.15}    /* 把透明度壓到極低，讓群體看起來不會太厚重 */
                            depthWrite={false} /* 關閉深度，讓原子團變成背景雲霧 */
                        />
                    )}
                </instancedMesh>
            );
        }
        // Phase 1 & 5: SES 半透明膜渲染
        function SESView({ visible }) {
            const gltf = useGLTF('./protein_ses.glb');
            const geometry = useMemo(() => {
                if (!gltf.nodes) return null;
                const meshNode = Object.values(gltf.nodes).find(n => n.isMesh);
                if (meshNode && meshNode.geometry) {
                    const geo = meshNode.geometry.clone();
                    geo.computeVertexNormals();
                    return geo;
                }
                return null;
            }, [gltf]);

            if (!visible || !geometry) return null;

            return (
                <mesh geometry={geometry}>
                    <meshPhongMaterial
                        color="#00aaff"           /* 賦予 SES 表面明顯的顏色 */
                        transparent={true}
                        opacity={0.4}             /* 明確的半透明度 */
                        shininess={15}
                        specular="#222222"
                        side={THREE.FrontSide}
                        depthWrite={false}        /* 關閉深度寫入以確保內部原子不被遮擋 */
                    />
                </mesh>
            );
        }
        // Phase 2: 全空間 3D 網格陣列 (覆蓋整個 Bounding Box)
        function GridWireframe({ algoData, atoms, visible, bounds }) {
            // 1. 主網格 (Macro Grid) - 2.5Å
            const macroGeo = useMemo(() => {
                if (!bounds) return null;
                const spacing = 2.5;
                const pts = [];
                const halfX = bounds.sizeX / 2; const halfY = bounds.sizeY / 2; const halfZ = bounds.sizeZ / 2;
                const numX = Math.floor(bounds.sizeX / spacing); const numY = Math.floor(bounds.sizeY / spacing); const numZ = Math.floor(bounds.sizeZ / spacing);
                const startX = - (numX * spacing) / 2; const startY = - (numY * spacing) / 2; const startZ = - (numZ * spacing) / 2;

                for (let j = 0; j <= numY; j++) for (let k = 0; k <= numZ; k++) { pts.push(new THREE.Vector3(-halfX, startY + j * spacing, startZ + k * spacing)); pts.push(new THREE.Vector3(halfX, startY + j * spacing, startZ + k * spacing)); }
                for (let i = 0; i <= numX; i++) for (let k = 0; k <= numZ; k++) { pts.push(new THREE.Vector3(startX + i * spacing, -halfY, startZ + k * spacing)); pts.push(new THREE.Vector3(startX + i * spacing, halfY, startZ + k * spacing)); }
                for (let i = 0; i <= numX; i++) for (let j = 0; j <= numY; j++) { pts.push(new THREE.Vector3(startX + i * spacing, startY + j * spacing, -halfZ)); pts.push(new THREE.Vector3(startX + i * spacing, startY + j * spacing, halfZ)); }

                return new THREE.BufferGeometry().setFromPoints(pts);
            }, [bounds]);

            // 2. 副網格 (Micro Grid) - 0.5Å
            const microGeo = useMemo(() => {
                if (!bounds) return null;
                const spacing = 0.5;
                const pts = [];
                const colors = [];

                const baseColor = new THREE.Color("#224466");
                const maxOpacity = 0.08;

                const halfX = bounds.sizeX / 2; const halfY = bounds.sizeY / 2; const halfZ = bounds.sizeZ / 2;
                const numX = Math.floor(bounds.sizeX / spacing); const numY = Math.floor(bounds.sizeY / spacing); const numZ = Math.floor(bounds.sizeZ / spacing);
                const startX = - (numX * spacing) / 2; const startY = - (numY * spacing) / 2; const startZ = - (numZ * spacing) / 2;

                const getFade = (x, y, z) => {
                    const fx = Math.abs(x) / halfX;
                    const fy = Math.abs(y) / halfY;
                    const fz = Math.abs(z) / halfZ;
                    const maxDist = Math.max(fx, fy, fz);
                    return Math.pow(maxDist, 4);
                };

                const addLine = (x1, y1, z1, x2, y2, z2) => {
                    pts.push(x1, y1, z1, x2, y2, z2);
                    const fade1 = getFade(x1, y1, z1);
                    const fade2 = getFade(x2, y2, z2);
                    colors.push(baseColor.r, baseColor.g, baseColor.b, fade1 * maxOpacity);
                    colors.push(baseColor.r, baseColor.g, baseColor.b, fade2 * maxOpacity);
                };

                for (let j = 0; j <= numY; j++) for (let k = 0; k <= numZ; k++) addLine(-halfX, startY + j * spacing, startZ + k * spacing, halfX, startY + j * spacing, startZ + k * spacing);
                for (let i = 0; i <= numX; i++) for (let k = 0; k <= numZ; k++) addLine(startX + i * spacing, -halfY, startZ + k * spacing, startX + i * spacing, halfY, startZ + k * spacing);
                for (let i = 0; i <= numX; i++) for (let j = 0; j <= numY; j++) addLine(startX + i * spacing, startY + j * spacing, -halfZ, startX + i * spacing, startY + j * spacing, halfZ);

                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
                geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 4));
                return geo;
            }, [bounds]);

            if (!visible || !bounds) return null;

            return (
                <group position={[bounds.cx, bounds.cy, bounds.cz]}>
                    <lineSegments geometry={microGeo} renderOrder={-1}>
                        <lineBasicMaterial vertexColors={true} transparent={true} blending={THREE.NormalBlending} depthWrite={false} />
                    </lineSegments>
                    <lineSegments geometry={macroGeo} renderOrder={-1}>
                        <lineBasicMaterial color="#113355" transparent={true} opacity={0.12} depthWrite={false} />
                    </lineSegments>
                </group>
            );
        }
        // Phase 3: 網格動畫掃描器
        function AlgorithmScanner({ algoData, atoms, phase, bounds }) {
            const [scanAxis, setScanAxis] = useState('x');

            const solventGeoRef = useRef();
            const proteinGeoRef = useRef();
            const cavityGeoRef = useRef();
            const scanPlaneRef = useRef();
            const scanState = useRef({ pos: -9999, phase: 'scanning', timer: 0 });
            const visible = phase === 3;

            const sortedData = useMemo(() => {
                if (!algoData || !algoData.voxels || !bounds) return null;

                const minX = bounds.cx - bounds.sizeX / 2; const maxX = bounds.cx + bounds.sizeX / 2;
                const minY = bounds.cy - bounds.sizeY / 2; const maxY = bounds.cy + bounds.sizeY / 2;
                const minZ = bounds.cz - bounds.sizeZ / 2; const maxZ = bounds.cz + bounds.sizeZ / 2;

                const filterAndSort = (pointsArray, axis) => {
                    const res = [];
                    for (let i = 0; i < pointsArray.length; i++) {
                        const [x, y, z] = pointsArray[i];
                        if (x >= minX && x <= maxX && y >= minY && y <= maxY && z >= minZ && z <= maxZ) {
                            res.push({ x, y, z });
                        }
                    }
                    res.sort((a, b) => a[axis] - b[axis]);

                    const flat = new Float32Array(res.length * 3);
                    for (let i = 0; i < res.length; i++) {
                        flat[i * 3] = res[i].x; flat[i * 3 + 1] = res[i].y; flat[i * 3 + 2] = res[i].z;
                    }
                    return { array: flat, count: res.length };
                };

                return {
                    x: { solvent: filterAndSort(algoData.voxels.solvent || [], 'x'), protein: filterAndSort(algoData.voxels.protein || [], 'x'), cavity: filterAndSort(algoData.voxels.cavity || [], 'x') },
                    y: { solvent: filterAndSort(algoData.voxels.solvent || [], 'y'), protein: filterAndSort(algoData.voxels.protein || [], 'y'), cavity: filterAndSort(algoData.voxels.cavity || [], 'y') },
                    z: { solvent: filterAndSort(algoData.voxels.solvent || [], 'z'), protein: filterAndSort(algoData.voxels.protein || [], 'z'), cavity: filterAndSort(algoData.voxels.cavity || [], 'z') }
                };
            }, [algoData, bounds]);

            useEffect(() => {
                if (solventGeoRef.current) solventGeoRef.current.setDrawRange(0, 0);
                if (proteinGeoRef.current) proteinGeoRef.current.setDrawRange(0, 0);
                if (cavityGeoRef.current) cavityGeoRef.current.setDrawRange(0, 0);
            }, [scanAxis]);

            const findVisibleCount = (array, totalCount, currentPos, axisOffset) => {
                let left = 0; let right = totalCount - 1; let ans = 0;
                while (left <= right) {
                    const mid = Math.floor((left + right) / 2);
                    if (array[mid * 3 + axisOffset] <= currentPos) {
                        ans = mid + 1; left = mid + 1;
                    } else { right = mid - 1; }
                }
                return ans;
            };

            useFrame((state, delta) => {
                if (!visible || !bounds || !sortedData) return;

                const axes = ['x', 'y', 'z'];
                const axisIdx = axes.indexOf(scanAxis);
                const offsets = { x: 0, y: 1, z: 2 };
                const currentOffset = offsets[scanAxis];

                const startVals = { x: bounds.cx - bounds.sizeX / 2, y: bounds.cy - bounds.sizeY / 2, z: bounds.cz - bounds.sizeZ / 2 };
                const endVals = { x: bounds.cx + bounds.sizeX / 2, y: bounds.cy + bounds.sizeY / 2, z: bounds.cz + bounds.sizeZ / 2 };

                const start = startVals[scanAxis];
                const end = endVals[scanAxis];

                if (scanState.current.pos === -9999) scanState.current.pos = start;

                if (scanState.current.phase === 'scanning') {
                    scanState.current.pos += 15.0 * delta;
                    if (scanState.current.pos > end) {
                        scanState.current.phase = 'pausing';
                        scanState.current.timer = 0;
                        scanState.current.pos = end;
                    }

                    if (scanPlaneRef.current) {
                        if (scanAxis === 'x') {
                            scanPlaneRef.current.position.set(scanState.current.pos, bounds.cy, bounds.cz);
                            scanPlaneRef.current.rotation.set(0, Math.PI / 2, 0);
                        }
                        if (scanAxis === 'y') {
                            scanPlaneRef.current.position.set(bounds.cx, scanState.current.pos, bounds.cz);
                            scanPlaneRef.current.rotation.set(Math.PI / 2, 0, 0);
                        }
                        if (scanAxis === 'z') {
                            scanPlaneRef.current.position.set(bounds.cx, bounds.cy, scanState.current.pos);
                            scanPlaneRef.current.rotation.set(0, 0, 0);
                        }
                    }

                    const currentData = sortedData[scanAxis];
                    if (solventGeoRef.current) solventGeoRef.current.setDrawRange(0, findVisibleCount(currentData.solvent.array, currentData.solvent.count, scanState.current.pos, currentOffset));
                    if (proteinGeoRef.current) proteinGeoRef.current.setDrawRange(0, findVisibleCount(currentData.protein.array, currentData.protein.count, scanState.current.pos, currentOffset));
                    if (cavityGeoRef.current) cavityGeoRef.current.setDrawRange(0, findVisibleCount(currentData.cavity.array, currentData.cavity.count, scanState.current.pos, currentOffset));

                } else if (scanState.current.phase === 'pausing') {
                    scanState.current.timer += delta;
                    if (scanState.current.timer > 0.6) {
                        scanState.current.phase = 'scanning';
                        const nextAxis = axes[(axisIdx + 1) % 3];
                        scanState.current.pos = startVals[nextAxis];
                        setScanAxis(nextAxis);
                    }
                }
            });

            if (!visible || !sortedData) return null;
            const currentData = sortedData[scanAxis];

            return (
                <group>
                    <points>
                        <bufferGeometry ref={solventGeoRef} key={`solvent-${scanAxis}`}>
                            <bufferAttribute attach="attributes-position" count={currentData.solvent.count} array={currentData.solvent.array} itemSize={3} />
                        </bufferGeometry>
                        <pointsMaterial color="#add8e6" size={0.4} transparent={true} opacity={0.25} depthWrite={false} />
                    </points>
                    <points>
                        <bufferGeometry ref={proteinGeoRef} key={`protein-${scanAxis}`}>
                            <bufferAttribute attach="attributes-position" count={currentData.protein.count} array={currentData.protein.array} itemSize={3} />
                        </bufferGeometry>
                        <pointsMaterial color="#ff9933" size={0.6} transparent={true} opacity={0.75} toneMapped={false} depthWrite={false} />
                    </points>
                    <points renderOrder={1}>
                        <bufferGeometry ref={cavityGeoRef} key={`cavity-${scanAxis}`}>
                            <bufferAttribute attach="attributes-position" count={currentData.cavity.count} array={currentData.cavity.array} itemSize={3} />
                        </bufferGeometry>
                        <pointsMaterial color="#00ffff" size={0.8} transparent={true} opacity={1.0} toneMapped={false} depthWrite={false} depthTest={false} />
                    </points>
                    {bounds && (
                        <mesh ref={scanPlaneRef}>
                            {scanAxis === 'x' && <planeGeometry args={[bounds.sizeZ, bounds.sizeY]} />}
                            {scanAxis === 'y' && <planeGeometry args={[bounds.sizeX, bounds.sizeZ]} />}
                            {scanAxis === 'z' && <planeGeometry args={[bounds.sizeX, bounds.sizeY]} />}
                            <meshBasicMaterial color={scanAxis === 'x' ? "#00ffff" : scanAxis === 'y' ? "#ff00ff" : "#ffff00"} transparent={true} opacity={0.3} side={THREE.DoubleSide} depthWrite={false} />
                        </mesh>
                    )}
                </group>
            );
        }
        // Phase 4: 網格動畫掃描器
        function ProbeScanner({ algoData, atoms, phase }) {
            const visible = phase === 4;
            const probeRef = useRef();
            const pocketGeoRef = useRef();
            const colorAttrRef = useRef();

            const scanState = useRef({ globalIdx: 0, timer: 0 });

            const sortedData = useMemo(() => {
                if (!algoData || !algoData.voxels) return null;

                const proteinPts = algoData.voxels.protein || [];
                const proteinFlat = new Float32Array(proteinPts.length * 3);
                for (let i = 0; i < proteinPts.length; i++) {
                    proteinFlat[i * 3] = proteinPts[i][0]; proteinFlat[i * 3 + 1] = proteinPts[i][1]; proteinFlat[i * 3 + 2] = proteinPts[i][2];
                }

                const cavityPts = (algoData.voxels.cavity || []).map(p => ({ x: p[0], y: p[1], z: p[2] }));
                cavityPts.sort((a, b) => {
                    if (Math.abs(a.y - b.y) > 0.01) return a.y - b.y;
                    if (Math.abs(a.x - b.x) > 0.01) return a.x - b.x;
                    return a.z - b.z;
                });

                const cavityFlat = new Float32Array(cavityPts.length * 3);
                const cavityColors = new Float32Array(cavityPts.length * 3);

                for (let i = 0; i < cavityPts.length; i++) {
                    cavityFlat[i * 3] = cavityPts[i].x; cavityFlat[i * 3 + 1] = cavityPts[i].y; cavityFlat[i * 3 + 2] = cavityPts[i].z;
                    cavityColors[i * 3] = 0.0; cavityColors[i * 3 + 1] = 0.3; cavityColors[i * 3 + 2] = 0.3;
                }

                return { proteinArray: proteinFlat, cavityPts: cavityPts, cavityArray: cavityFlat, cavityColors: cavityColors };
            }, [algoData]);

            const proteinMaterial = useMemo(() => {
                return new THREE.ShaderMaterial({
                    uniforms: {
                        baseColor: { value: new THREE.Color("#ff9933") },
                        currentY: { value: -999.0 },
                        layerThickness: { value: 1.0 },
                        activeOpacity: { value: 0.65 },
                        inactiveOpacity: { value: 0.02 },
                        size: { value: 3.5 }
                    },
                    vertexShader: `
                uniform float size;
                uniform float currentY;
                varying float vDistance;
                void main() {
                    vDistance = abs(position.y - currentY);
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = size * (20.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
                    fragmentShader: `
                uniform vec3 baseColor;
                uniform float activeOpacity;
                uniform float inactiveOpacity;
                uniform float layerThickness;
                varying float vDistance;
                void main() {
                    float alpha = vDistance < layerThickness ? activeOpacity : inactiveOpacity;
                    vec2 coord = gl_PointCoord - vec2(0.5);
                    if(length(coord) > 0.5) discard; 
                    gl_FragColor = vec4(baseColor, alpha);
                }
            `,
                    transparent: true,
                    depthWrite: false,
                });
            }, []);

            useFrame((state, delta) => {
                if (!visible || !sortedData || sortedData.cavityPts.length === 0) return;

                const pts = sortedData.cavityPts;
                const currentIdx = scanState.current.globalIdx;
                const currentPoint = pts[currentIdx];
                const currentY = currentPoint.y;

                if (probeRef.current) {
                    probeRef.current.position.lerp(new THREE.Vector3(currentPoint.x, currentPoint.y, currentPoint.z), 0.4);
                    probeRef.current.rotation.x += delta * 2.5; probeRef.current.rotation.y += delta * 2.5;
                }

                if (proteinMaterial) proteinMaterial.uniforms.currentY.value = currentY;

                const colors = sortedData.cavityColors;
                for (let i = 0; i < pts.length; i++) {
                    const p = pts[i];
                    const isScanned = i <= currentIdx;
                    const isCurrentLayer = Math.abs(p.y - currentY) < 0.5;

                    let r, g, b;
                    if (isScanned) {
                        if (isCurrentLayer) { r = 1.0; g = 0.2; b = 1.0; } else { r = 0.4; g = 0.0; b = 0.4; }
                    } else {
                        if (isCurrentLayer) { r = 0.0; g = 1.0; b = 1.0; } else { r = 0.0; g = 0.3; b = 0.3; }
                    }
                    colors[i * 3] = r; colors[i * 3 + 1] = g; colors[i * 3 + 2] = b;
                }

                if (colorAttrRef.current) colorAttrRef.current.needsUpdate = true;

                scanState.current.timer += delta;
                if (scanState.current.timer > 0.012) {
                    scanState.current.globalIdx++;
                    scanState.current.timer = 0;
                    if (scanState.current.globalIdx >= pts.length) scanState.current.globalIdx = 0;
                }
            });

            if (!visible || !sortedData) return null;

            return (
                <group>
                    <points renderOrder={0}>
                        <bufferGeometry>
                            <bufferAttribute attach="attributes-position" count={sortedData.proteinArray.length / 3} array={sortedData.proteinArray} itemSize={3} />
                        </bufferGeometry>
                        <primitive object={proteinMaterial} attach="material" />
                    </points>
                    <points renderOrder={1}>
                        <bufferGeometry ref={pocketGeoRef}>
                            <bufferAttribute attach="attributes-position" count={sortedData.cavityArray.length / 3} array={sortedData.cavityArray} itemSize={3} />
                            <bufferAttribute ref={colorAttrRef} attach="attributes-color" count={sortedData.cavityColors.length / 3} array={sortedData.cavityColors} itemSize={3} />
                        </bufferGeometry>
                        <pointsMaterial size={0.8} vertexColors={true} transparent={true} opacity={1.0} depthWrite={false} depthTest={false} toneMapped={false} />
                    </points>
                    <group ref={probeRef}>
                        <mesh>
                            <sphereGeometry args={[1.4, 16, 16]} />
                            <meshBasicMaterial color="#ff00ff" wireframe={true} transparent={true} opacity={0.6} depthTest={false} />
                        </mesh>
                        <mesh>
                            <sphereGeometry args={[0.3, 8, 8]} />
                            <meshBasicMaterial color="#ffffff" depthTest={false} />
                        </mesh>
                    </group>
                </group>
            );
        }
        // Phase 5: 口袋平滑 Mesh
        function PocketMesh({ meshData, visible }) {
            // 1. 監聽並印出收到的資料，幫助除錯
            React.useEffect(() => {
                if (visible) {
                    console.log("🔍 [PocketMesh] 目前收到的 meshData:", meshData);
                }
            }, [meshData, visible]);

            const geometry = useMemo(() => {
                if (!meshData || !meshData.vertices || meshData.vertices.length === 0) {
                    console.warn("⚠️ [PocketMesh] 沒有有效的 vertices 資料！");
                    return null;
                }

                try {
                    const geo = new THREE.BufferGeometry();

                    // 攤平資料
                    const verts = new Float32Array(meshData.vertices.flat());
                    const indices = new Uint32Array(meshData.faces.flat());

                    console.log(`📊 [PocketMesh] 成功攤平！頂點數量: ${verts.length / 3}, 三角面數量: ${indices.length / 3}`);

                    geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
                    geo.setIndex(new THREE.BufferAttribute(indices, 1));
                    geo.computeVertexNormals();
                    return geo;
                } catch (err) {
                    console.error("❌ [PocketMesh] 幾何體建構失敗:", err);
                    return null;
                }
            }, [meshData]);

            if (!visible || !geometry) return null;

            return (
                <mesh geometry={geometry} renderOrder={999}>
                    {/* 2. 終極測試材質：純紅線條 + 無視遮蔽 (depthTest={false}) */}
                    <meshBasicMaterial
                        color="#ff0000"
                        wireframe={true}
                        side={THREE.DoubleSide}
                        depthTest={false}
                    />
                </mesh>
            );
        }

        function App() {
            const [data, setData] = useState(null);
            const [error, setError] = useState(null);
            const [phase, setPhase] = useState(1);
            const [phase1Opts, setPhase1Opts] = useState({ vdw: true, ses: true });
            const bounds = useMemo(() => {
                if (!data || !data.atoms) return null;
                return computeTightBounds(data.atoms);
            }, [data]);

            useEffect(() => {
                fetch('./precomputed_data.json')
                    .then(res => {
                        if (!res.ok) throw new Error(`找不到 precomputed_data.json`);
                        return res.json();
                    })
                    .then(setData)
                    .catch(err => setError(err.toString()));
            }, []);

            if (error) return <div className="loading" style={{ color: '#ff4444' }}>載入失敗: {error}</div>;
            if (!data) return <div className="loading">載入中...</div>;

            return (
                <Boundary>
                    <div className="ui-panel">
                        <h2>Pocket Algorithm</h2>

                        <button className={`phase-btn ${phase === 1 ? 'active' : ''}`} onClick={() => setPhase(1)}>
                            Phase 1: 結構視覺化
                        </button>
                        {phase === 1 && (
                            <div className="sub-options">
                                <button className={`sub-btn ${phase1Opts.vdw ? 'active' : ''}`} onClick={() => setPhase1Opts(p => ({ ...p, vdw: !p.vdw }))}>VDW 原子</button>
                                <button className={`sub-btn ${phase1Opts.ses ? 'active' : ''}`} onClick={() => setPhase1Opts(p => ({ ...p, ses: !p.ses }))}>SES 表面</button>
                            </div>
                        )}
                        <button className={`phase-btn ${phase === 2 ? 'active' : ''}`} onClick={() => setPhase(2)}>
                            Phase 2: 空間網格化
                        </button>
                        <button className={`phase-btn ${phase === 3 ? 'active' : ''}`} onClick={() => setPhase(3)}>
                            Phase 3: 距離場切面掃描
                        </button>
                        <button className={`phase-btn ${phase === 4 ? 'active' : ''}`} onClick={() => setPhase(4)}>
                            Phase 4: 探針球侵蝕掃描
                        </button>
                        <button className={`phase-btn ${phase === 5 ? 'active' : ''}`} onClick={() => setPhase(5)}>
                            Phase 5: 表面平滑化
                        </button>
                    </div>

                    {(phase === 3 || phase === 4) && (
                        <div className="legend">
                            <div className="legend-item"><div className="color-box" style={{ background: '#add8e6' }}></div> 溶劑區</div>
                            <div className="legend-item"><div className="color-box" style={{ background: '#ff9933' }}></div> 蛋白區</div>
                            <div className="legend-item"><div className="color-box" style={{ background: '#00ffff' }}></div> 空腔區</div>
                            {phase === 4 &&
                                <div className="legend-item"><div className="color-box" style={{ background: '#ff00ff' }}></div> 探針區
                                </div>}
                        </div>
                    )}
                    <Canvas camera={{ position: [0, 0, 75], fov: 45 }}>
                        <color attach="background" args={['#030508']} />
                        <OrbitControls autoRotate={phase === 5 || phase === 1} autoRotateSpeed={0.5} makeDefault />

                        {/* 1. 環境光 */}
                        <ambientLight intensity={0.6} />

                        {/* 2. 主光源 - 提供立體感，不會將表面照到發白 */}
                        <directionalLight position={[20, 20, 20]} intensity={1.5} />

                        {/* 3. 背面輪廓光 - 專門勾勒 SES 邊緣 */}
                        <directionalLight position={[-20, -10, -20]} intensity={0.8} color="#00f0ff" />

                        {/* 4. 頂部輔助光 - 柔和提亮整體 */}
                        <pointLight position={[0, 20, 0]} intensity={0.8} color="#ffffff" />

                        <Suspense fallback={null}>
                            <group position={[0, 0, 0]}>
                                {/* 統一呼叫的邊界框，在 Phase 2, 3, 4 顯示 */}
                                {bounds && (phase === 2 || phase === 3 || phase === 4) && (
                                    <group position={[bounds.cx, bounds.cy, bounds.cz]}>
                                        <boxHelper
                                            args={[new THREE.Mesh(new THREE.BoxGeometry(bounds.sizeX, bounds.sizeY, bounds.sizeZ))]}
                                            color="#ffee00"
                                            renderOrder={-1}
                                        />
                                    </group>
                                )}
                                {/* Phase 1, 2, 3: vdw */}
                                <AtomView
                                    atoms={data.atoms}
                                    visible={(phase === 1 && phase1Opts.vdw) || phase === 2 || phase === 3}
                                    dimmed={phase === 2 || phase === 3} />
                                {/* Phase 1: SES */}
                                <SESView visible={(phase === 1 && phase1Opts.ses) || phase === 5} />
                                {/* Phase 2: 空間網格化 */}
                                <GridWireframe algoData={data.algo_data} atoms={data.atoms} visible={phase === 2} bounds={bounds} />
                                {/* Phase 3: 距離場掃描動畫 */}
                                <AlgorithmScanner algoData={data.algo_data} atoms={data.atoms} phase={phase} bounds={bounds} />
                                {/* Phase 4: 探針掃描動畫 */}
                                <ProbeScanner algoData={data.algo_data} phase={phase} />
                                {/* Phase 5: 口袋 Mesh 呈現 */}
                                <PocketMesh meshData={data.algo_data.pocket_mesh} visible={phase === 5} />
                            </group>
                        </Suspense>
                    </Canvas>
                </Boundary>
            );
        }
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
