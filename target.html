<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 演算法動畫展示 - 四階段完整版</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #050510; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #root { width: 100vw; height: 100vh; }
    
    /* UI 控制面板樣式 */
    .ui-panel {
      position: absolute; top: 20px; right: 20px; z-index: 10;
      display: flex; flex-direction: column; gap: 10px;
      background: rgba(10, 15, 30, 0.85); padding: 20px; border-radius: 12px;
      border: 1px solid #1a2a40; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
    }
    .ui-panel h2 { color: #fff; margin: 0 0 15px 0; font-size: 18px; text-transform: uppercase; letter-spacing: 1px;}
    .phase-btn {
      background: #111; color: #888; border: 1px solid #333;
      padding: 12px 15px; border-radius: 6px; cursor: pointer;
      font-weight: bold; text-align: left; transition: all 0.3s ease;
      font-size: 14px;
    }
    .phase-btn:hover { background: #1a2a40; color: #00f0ff; border-color: #00f0ff; }
    .phase-btn.active { background: #00f0ff; color: #000; border-color: #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
    
    .loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #00f0ff; font-size: 24px; font-weight: bold; letter-spacing: 2px; text-align: center;
    }
  </style>

  <!-- 嚴格鎖定 Three.js 與 React 的相依性，避免 CDN 下載重複實例導致黑屏 -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "three": "https://esm.sh/three@0.150.0",
        "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.13.0?external=react,react-dom,three",
        "@react-three/drei": "https://esm.sh/@react-three/drei@9.70.0?external=react,react-dom,three,@react-three/fiber"
      }
    }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useRef, useState, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Canvas, useFrame } from '@react-three/fiber';
    import { OrbitControls, Box, Sphere } from '@react-three/drei';
    import * as THREE from 'three';

    // ==========================================
    // Phase 1: 蛋白質實體與網格化 (Spatial Hashing)
    // ==========================================
    function Phase1_ProteinAndGrid({ mockData }) {
      return (
        <group>
          {/* 渲染蛋白質原子 (粉紅色) */}
          {mockData.atoms.map((pos, i) => (
            <Sphere key={i} args={[1.5, 32, 32]} position={pos}>
              <meshStandardMaterial color="#ff3366" transparent opacity={0.9} roughness={0.2} />
            </Sphere>
          ))}
          
          {/* 顯示 Spatial Hashing 的外框網格 */}
          <Box args={[15, 12, 15]} position={[0, 1.5, 0]}>
            <meshBasicMaterial color="#00f0ff" wireframe transparent opacity={0.4} />
          </Box>
        </group>
      );
    }

    // ==========================================
    // Phase 2: 距離場切面 (利用 GLSL Shader 呈現熱力圖)
    // ==========================================
    function Phase2_DistanceField({ mockData }) {
      const planeRef = useRef();
      const materialRef = useRef(); // 新增 materialRef 來動態更新 Shader 變數
      
      // 將原子座標傳遞給 Shader，補齊到 50 顆以符合 Shader 固定陣列長度限制
      const uniforms = useMemo(() => {
        const MAX_ATOMS = 50;
        const paddedAtoms = [];
        for (let i = 0; i < MAX_ATOMS; i++) {
          if (i < mockData.atoms.length) paddedAtoms.push(new THREE.Vector3(...mockData.atoms[i]));
          else paddedAtoms.push(new THREE.Vector3(999, 999, 999));
        }
        return {
          atoms: { value: paddedAtoms },
          numAtoms: { value: mockData.atoms.length },
          uAxis: { value: 1 } // 新增 uAxis: 0=X, 1=Y, 2=Z，用於 Shader 切換格線
        };
      }, [mockData]);

      // 動畫：依序沿著 X, Y, Z 三個方向循環掃描
      useFrame((state) => {
        if (planeRef.current && materialRef.current) {
          const t = state.clock.elapsedTime;
          // 設定每 12 秒一個完整循環 (X, Y, Z 軸各 4 秒)
          const cycle = t % 12;
          const phaseDuration = 4;
          const progress = cycle % phaseDuration;
          
          // 讓切面在 -7 到 7 的範圍內來回平滑掃描
          const offset = Math.sin((progress / phaseDuration) * Math.PI * 2) * 7;

          if (cycle < 4) {
            // X 軸方向掃描
            planeRef.current.rotation.set(0, Math.PI / 2, 0);
            planeRef.current.position.set(offset, 2.5, 0); // 蛋白質中心 Y=2.5
            materialRef.current.uniforms.uAxis.value = 0;
          } else if (cycle < 8) {
            // Y 軸方向掃描
            planeRef.current.rotation.set(-Math.PI / 2, 0, 0);
            planeRef.current.position.set(0, 2.5 + offset, 0);
            materialRef.current.uniforms.uAxis.value = 1;
          } else {
            // Z 軸方向掃描
            planeRef.current.rotation.set(0, 0, 0);
            planeRef.current.position.set(0, 2.5, offset);
            materialRef.current.uniforms.uAxis.value = 2;
          }
        }
      });

      return (
        <group>
          {/* 幽靈蛋白質 (調高不透明度，讓背景蛋白質更清楚) */}
          {mockData.atoms.map((pos, i) => (
            <Sphere key={`ghost-${i}`} args={[1.5, 16, 16]} position={pos}>
              <meshBasicMaterial color="#555" wireframe transparent opacity={0.25} />
            </Sphere>
          ))}
          
          {/* 動態距離場熱力圖平面 */}
          <mesh ref={planeRef}>
            <planeGeometry args={[18, 18, 64, 64]} />
            <shaderMaterial
              ref={materialRef}
              uniforms={uniforms}
              transparent={true}
              side={THREE.DoubleSide}
              vertexShader={`
                varying vec3 vWorldPosition;
                void main() {
                  vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                  vWorldPosition = worldPosition.xyz;
                  gl_Position = projectionMatrix * viewMatrix * worldPosition;
                }
              `}
              fragmentShader={`
                uniform vec3 atoms[50];
                uniform int numAtoms;
                uniform int uAxis;
                varying vec3 vWorldPosition;
                void main() {
                  float minDist = 999.0;
                  // 計算平面上每個像素到最近原子的距離
                  for(int i = 0; i < 50; i++) {
                    if(i >= numAtoms) break;
                    float d = distance(vWorldPosition, atoms[i]);
                    if(d < minDist) minDist = d;
                  }
                  
                  // 熱力圖上色邏輯
                  vec3 color = vec3(0.0);
                  float alpha = 0.85;
                  if (minDist <= 1.8) {
                    color = vec3(1.0, 0.2, 0.3); // 內部碰撞區 (紅)
                  } else if (minDist <= 3.5) {
                    color = vec3(1.0, 0.8, 0.0); // 表面口袋區 (黃)
                  } else {
                    color = vec3(0.0, 0.3, 0.8); // 外部空腔 (藍)
                    alpha = 0.25;
                  }
                  
                  // 繪製科技感格線 (依據掃描軸向動態切換垂直於切面的網格)
                  float grid = 0.0;
                  if (uAxis == 0) {
                    grid = mod(vWorldPosition.y, 1.0) < 0.05 || mod(vWorldPosition.z, 1.0) < 0.05 ? 1.0 : 0.0;
                  } else if (uAxis == 1) {
                    grid = mod(vWorldPosition.x, 1.0) < 0.05 || mod(vWorldPosition.z, 1.0) < 0.05 ? 1.0 : 0.0;
                  } else {
                    grid = mod(vWorldPosition.x, 1.0) < 0.05 || mod(vWorldPosition.y, 1.0) < 0.05 ? 1.0 : 0.0;
                  }
                  
                  gl_FragColor = vec4(color + grid * 0.3, alpha);
                }
              `}
            />
          </mesh>
        </group>
      );
    }

    // ==========================================
    // Phase 3 & 4 共用引擎: Voxel 渲染器
    // ==========================================
    function Phase34_VoxelEngine({ mockData, phase }) {
      const meshRef = useRef();
      const wireframeRef = useRef(); // 新增 wireframeRef 來處理空心線框
      const probeRef = useRef();
      const dummy = useMemo(() => new THREE.Object3D(), []);

      // 提升顏色明度，解決黑色背景下看不清楚的問題
      const C_PROTEIN = new THREE.Color("#4a5568"); // 隱藏狀態的蛋白質改為石板灰
      const C_POCKET_BASE = new THREE.Color("#2b6cb0"); // Phase 3 掃描底色改為亮藍色
      const C_POCKET_ACTIVE = new THREE.Color("#00f0ff"); // Phase 3 掃描亮點 (青藍)
      const C_POCKET_FINAL = new THREE.Color("#ffdd00");  // Phase 4 最終口袋 (金色)

      // 當切換 Phase 時，重新初始化所有 Voxel 的基準顏色與顯示狀態
      useEffect(() => {
        if (!meshRef.current || !wireframeRef.current) return;
        
        mockData.voxels.forEach((pos, i) => {
          dummy.position.set(...pos);
          dummy.updateMatrix();
          
          // Phase 4 顯示實體方塊，Phase 3 顯示空心線框
          if (phase === 4) {
             meshRef.current.setMatrixAt(i, dummy.matrix);
             wireframeRef.current.setMatrixAt(i, new THREE.Matrix4().makeScale(0,0,0)); // 隱藏線框
          } else {
             wireframeRef.current.setMatrixAt(i, dummy.matrix);
             meshRef.current.setMatrixAt(i, new THREE.Matrix4().makeScale(0,0,0)); // 隱藏實體方塊
          }

          let color = new THREE.Color("#000000"); // 預設黑
          let isVisible = false; // 是否顯示這個網格
          
          if (mockData.protein_voxels.includes(i)) {
            color = C_PROTEIN;
            isVisible = true;
          } else if (mockData.pocket_voxels.includes(i)) {
            color = phase === 4 ? C_POCKET_FINAL : C_POCKET_BASE;
            isVisible = true;
          }
          
          // 如果不屬於蛋白質或口袋，或者在 Phase 3 的蛋白質實體，我們可以選擇性隱藏以增加通透度
          // 這裡我們讓不相關的網格完全消失 (縮放為0)
          if(!isVisible) {
              const hiddenMatrix = new THREE.Matrix4().makeScale(0,0,0);
              meshRef.current.setMatrixAt(i, hiddenMatrix);
              wireframeRef.current.setMatrixAt(i, hiddenMatrix);
          } else {
              meshRef.current.setColorAt(i, color);
              wireframeRef.current.setColorAt(i, color);
          }
        });
        
        meshRef.current.instanceMatrix.needsUpdate = true;
        meshRef.current.instanceColor.needsUpdate = true;
        wireframeRef.current.instanceMatrix.needsUpdate = true;
        wireframeRef.current.instanceColor.needsUpdate = true;
      }, [mockData, phase, dummy]);

      // 動畫：處理 Phase 3 的探針掃描與動態點亮
      useFrame((state) => {
        if (phase !== 3 || !wireframeRef.current || !probeRef.current) return;
        
        const nextFrame = Math.floor(state.clock.elapsedTime * 15) % mockData.frames.length;
        const frameData = mockData.frames[nextFrame];
        
        // 移動探針
        probeRef.current.position.set(...frameData.probe_pos);

        // 每幀重置口袋區為底色 (注意：Phase 3 是更新 wireframeRef)
        mockData.pocket_voxels.forEach(idx => wireframeRef.current.setColorAt(idx, C_POCKET_BASE));
        
        // 點亮被掃描到的區域
        frameData.active_indices.forEach(idx => wireframeRef.current.setColorAt(idx, C_POCKET_ACTIVE));
        
        wireframeRef.current.instanceColor.needsUpdate = true;
      });

      return (
        <group>
          {/* Phase 3 的發光探針 */}
          {phase === 3 && (
            <mesh ref={probeRef}>
              <sphereGeometry args={[2.0, 32, 32]} />
              <meshStandardMaterial color="#00f0ff" transparent opacity={0.6} emissive="#00f0ff" emissiveIntensity={0.5} />
            </mesh>
          )}
          
          {/* Voxel 陣列 1：Phase 4 萃取口袋使用的實體方塊 */}
          <instancedMesh ref={meshRef} args={[null, null, mockData.voxels.length]}>
            <boxGeometry args={[0.75, 0.75, 0.75]} />
            <meshStandardMaterial roughness={0.3} metalness={0.2} transparent opacity={0.85} />
          </instancedMesh>
          
          {/* Voxel 陣列 2：Phase 3 探針掃描使用的空心網格線 (Wireframe) */}
          <instancedMesh ref={wireframeRef} args={[null, null, mockData.voxels.length]}>
            <boxGeometry args={[0.75, 0.75, 0.75]} />
            <meshBasicMaterial wireframe={true} transparent opacity={0.4} />
          </instancedMesh>
        </group>
      );
    }

    // ==========================================
    // 主應用程式與 UI
    // ==========================================
    function App() {
      const [data, setData] = useState(null);
      const [error, setError] = useState(null);
      const [phase, setPhase] = useState(1); // 預設停在 Phase 1

      useEffect(() => {
        // 從 GitHub 伺服器抓取剛才產生的 JSON
        fetch('./mock_protein.json')
          .then(res => {
            if (!res.ok) throw new Error(`找不到檔案 (HTTP ${res.status})，請確認 mock_protein.json 是否已上傳至同一個資料夾。`);
            return res.json();
          })
          .then(setData)
          .catch(err => setError(err.toString()));
      }, []);

      // 錯誤與載入狀態畫面
      if (error) return <div className="loading" style={{color: '#ff3366'}}>載入失敗！<br/><span style={{fontSize: '16px'}}>{error}</span></div>;
      if (!data) return <div className="loading">讀取演算法軌跡資料中...</div>;

      const phases = [
        { id: 1, name: "Phase 1: 蛋白質實體與網格化" },
        { id: 2, name: "Phase 2: 距離場切面" },
        { id: 3, name: "Phase 3: 2.5D 切片滾動探針" },
        { id: 4, name: "Phase 4: 萃取結合口袋" }
      ];

      return (
        <>
          <div className="ui-panel">
            <h2>Algorithm Stages</h2>
            {phases.map(p => (
              <button 
                key={p.id} 
                className={`phase-btn ${phase === p.id ? 'active' : ''}`}
                onClick={() => setPhase(p.id)}
              >
                {p.name}
              </button>
            ))}
          </div>

          <Canvas camera={{ position: [16, 14, 16], fov: 45 }}>
            <color attach="background" args={['#050510']} />
            
            {/* 提升環境光與平行光亮度，並加入點光源點綴邊緣，確保深色幾何體清晰可見 */}
            <ambientLight intensity={1.5} />
            <directionalLight position={[10, 20, 10]} intensity={2.5} />
            <pointLight position={[-10, -10, -10]} intensity={1.0} color="#00f0ff" />
            
            {/* 根據按鈕動態切換場景 */}
            {phase === 1 && <Phase1_ProteinAndGrid mockData={data} />}
            {phase === 2 && <Phase2_DistanceField mockData={data} />}
            {(phase === 3 || phase === 4) && <Phase34_VoxelEngine mockData={data} phase={phase} />}
            
            {/* Phase 1 讓畫面自動旋轉 */}
            <OrbitControls autoRotate={phase === 1} autoRotateSpeed={1.0} target={[0, 2, 0]} />
          </Canvas>
        </>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
