<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 演算法動畫展示 - 外部 JSON 擷取版</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; }
    #root { width: 100vw; height: 100vh; }
    #loading { 
      position: absolute; 
      top: 50%; left: 50%; 
      transform: translate(-50%, -50%); 
      color: #00f0ff; 
      font-family: sans-serif; 
      font-size: 24px; 
      font-weight: bold; 
      letter-spacing: 2px; 
      z-index: 10;
    }
    #info { 
      position: absolute; 
      bottom: 20px; 
      left: 20px; 
      color: white; 
      font-family: sans-serif; 
      background: rgba(0,0,0,0.7); 
      padding: 15px; 
      border-radius: 8px; 
      border: 1px solid #333; 
      z-index: 10;
      line-height: 1.5;
    }
  </style>

  <!-- 1. 定義套件來源 (使用 esm.sh CDN) -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "three": "https://esm.sh/three@0.160.0",
        "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.12",
        "@react-three/drei": "https://esm.sh/@react-three/drei@9.96.1"
      }
    }
  </script>

  <!-- 2. 載入 Babel 以便在瀏覽器中即時編譯 JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="info">
    <b>3D 網格掃描法 (Grid Scanning)</b><br/>
    正在讀取同一目錄下的 <code>mock_scan.json</code><br/>
    <small style="color:#aaa;">可拖曳滑鼠旋轉視角，滾輪縮放。</small>
  </div>
  <div id="root">
    <div id="loading">讀取 JSON 軌跡資料中...</div>
  </div>

  <!-- 3. 撰寫 React 程式碼 (注意 type="text/babel") -->
  <script type="text/babel" data-type="module">
    import React, { useRef, useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Canvas, useFrame } from '@react-three/fiber';
    import { OrbitControls } from '@react-three/drei';
    import * as THREE from 'three';

    // 預先宣告顏色與佔位用 3D 物件，避免迴圈內重複建立浪費記憶體
    const COLOR_BASE = new THREE.Color("#1a1a2e"); // 未掃描的暗色
    const COLOR_ACTIVE = new THREE.Color("#00f0ff"); // 掃描到的霓虹色
    const dummy = new THREE.Object3D();

    function AlgorithmScanner({ mockData }) {
      const meshRef = useRef();
      const probeRef = useRef();
      const [currentFrame, setCurrentFrame] = useState(0);
      const numVoxels = mockData.voxels.length;

      // 初始化：將所有 Voxel 放到對應位置並設定預設顏色
      useEffect(() => {
        if (!meshRef.current) return;
        
        mockData.voxels.forEach((pos, i) => {
          dummy.position.set(pos[0], pos[1], pos[2]);
          dummy.updateMatrix();
          meshRef.current.setMatrixAt(i, dummy.matrix);
          meshRef.current.setColorAt(i, COLOR_BASE);
        });
        
        meshRef.current.instanceMatrix.needsUpdate = true;
        meshRef.current.instanceColor.needsUpdate = true;
      }, [mockData]);

      // 動畫迴圈：根據 JSON 的幀數更新狀態
      useFrame((state) => {
        if (!meshRef.current || !probeRef.current) return;

        // 計算目前應該播放哪一幀 (每秒推進約 15 幀)
        const nextFrame = Math.floor(state.clock.elapsedTime * 15) % mockData.frames.length;
        if (nextFrame === currentFrame) return;

        const frameData = mockData.frames[nextFrame];
        
        // 1. 更新探針球體位置
        probeRef.current.position.set(
          frameData.probe_pos[0], 
          frameData.probe_pos[1], 
          frameData.probe_pos[2]
        );

        // 2. 重置所有 Voxel 的顏色為暗色
        for (let i = 0; i < numVoxels; i++) {
          meshRef.current.setColorAt(i, COLOR_BASE);
        }
        
        // 3. 點亮這一幀被探針掃描到的 Voxel
        frameData.active_indices.forEach(index => {
          meshRef.current.setColorAt(index, COLOR_ACTIVE);
        });

        // 4. 標記需要更新渲染
        meshRef.current.instanceColor.needsUpdate = true;
        setCurrentFrame(nextFrame);
      });

      return (
        <group>
          {/* 探針實體 */}
          <mesh ref={probeRef}>
            <sphereGeometry args={[2.5, 32, 32]} />
            <meshStandardMaterial color="#ff0055" transparent opacity={0.8} emissive="#ff0055" emissiveIntensity={0.5} />
          </mesh>

          {/* Voxel 陣列：使用 InstancedMesh 高效渲染 */}
          <instancedMesh ref={meshRef} args={[null, null, numVoxels]}>
            <boxGeometry args={[0.7, 0.7, 0.7]} />
            <meshBasicMaterial toneMapped={false} transparent opacity={0.9} />
          </instancedMesh>
        </group>
      );
    }

    function App() {
      const [data, setData] = useState(null);
      const [error, setError] = useState(null);

      // 載入 JSON 資料
      useEffect(() => {
        fetch('./mock_scan.json')
          .then(res => {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then(setData)
          .catch(err => {
            console.error("載入 JSON 失敗:", err);
            setError("無法載入 mock_scan.json。請確保檔案存在且使用本地伺服器執行！");
          });
      }, []);

      if (error) {
        return <div style={{ color: '#ff3366', padding: '20px', fontFamily: 'sans-serif' }}>{error}</div>;
      }

      if (!data) {
        return null; // 載入畫面已在原本的 HTML 結構中
      }

      // 將 React DOM 蓋過原本的 loading div
      return (
        <Canvas camera={{ position: [20, 15, 20], fov: 45 }}>
          <ambientLight intensity={0.5} />
          <AlgorithmScanner mockData={data} />
          <OrbitControls autoRotate autoRotateSpeed={1.5} />
        </Canvas>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
