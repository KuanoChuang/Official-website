<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pre-computed Protein Visualizer</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #030508; font-family: 'Segoe UI', Tahoma, sans-serif; }
    #root { width: 100vw; height: 100vh; }
    
    .ui-panel {
      position: absolute; top: 20px; right: 20px; z-index: 10;
      display: flex; flex-direction: column; gap: 8px; width: 320px;
      background: rgba(10, 15, 30, 0.85); padding: 25px; border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      backdrop-filter: blur(12px);
    }
    .ui-panel h2 { color: #fff; margin: 0 0 10px 0; font-size: 15px; letter-spacing: 2px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px;}
    .phase-btn {
      background: rgba(255,255,255,0.05); color: #aaa; border: 1px solid rgba(255,255,255,0.1);
      padding: 12px 15px; border-radius: 8px; cursor: pointer;
      font-weight: 500; text-align: left; transition: all 0.2s; font-size: 13px;
    }
    .phase-btn:hover { background: rgba(0, 240, 255, 0.1); color: #fff; border-color: #00f0ff; }
    .phase-btn.active { 
      background: #00f0ff; color: #000; border-color: #00f0ff; 
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); font-weight: bold;
    }
    
    .sub-options { display: flex; gap: 10px; margin-top: 5px; margin-bottom: 5px; }
    .sub-btn { 
      flex: 1; padding: 6px; font-size: 11px; background: rgba(255,255,255,0.1); 
      border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 4px; cursor: pointer;
    }
    .sub-btn:hover { background: rgba(255, 0, 119, 0.3); }
    .sub-btn.active { background: #ff0077; border-color: #ff0077; font-weight: bold;}
    
    .loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #00f0ff; font-size: 20px; font-weight: 300; letter-spacing: 1px;
    }
    
    .legend {
      position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7);
      padding: 15px; border-radius: 10px; color: #fff; font-size: 12px; display: flex; flex-direction: column; gap: 5px;
    }
    .legend-item { display: flex; align-items: center; gap: 10px; }
    .color-box { width: 15px; height: 15px; border-radius: 3px; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "three": "https://esm.sh/three@0.150.0",
        "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.13.0?external=react,react-dom,three",
        "@react-three/drei": "https://esm.sh/@react-three/drei@9.70.0?external=react,react-dom,three,@react-three/fiber"
      }
    }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useRef, useState, useEffect, useLayoutEffect, useMemo, Suspense } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Canvas, useFrame } from '@react-three/fiber';
    import { OrbitControls, useGLTF } from '@react-three/drei';
    import * as THREE from 'three';

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -50%)', color: '#ff4444', backgroundColor: 'rgba(0,0,0,0.9)', padding: '30px', borderRadius: '10px', zIndex: 100, border: '1px solid #ff4444' }}>
              <h3>渲染崩潰 (Crash)</h3>
              <pre style={{ whiteSpace: 'pre-wrap', fontSize: '12px' }}>{this.state.error.message}</pre>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // 計算合身邊界 (共用邏輯)
    function computeTightBounds(atoms, padding = 2.0) {
       if (!atoms || atoms.length === 0) return { sizeX: 20, sizeY: 20, sizeZ: 20, cx: 0, cy: 0, cz: 0 };
       let minX = 9999, minY = 9999, minZ = 9999;
       let maxX = -9999, maxY = -9999, maxZ = -9999;
       atoms.forEach(a => {
          const r = a.radius || 1.5;
          minX = Math.min(minX, a.pos[0] - r);
          minY = Math.min(minY, a.pos[1] - r);
          minZ = Math.min(minZ, a.pos[2] - r);
          maxX = Math.max(maxX, a.pos[0] + r);
          maxY = Math.max(maxY, a.pos[1] + r);
          maxZ = Math.max(maxZ, a.pos[2] + r);
       });
       const sizeX = (maxX - minX) + padding * 2;
       const sizeY = (maxY - minY) + padding * 2;
       const sizeZ = (maxZ - minZ) + padding * 2;
       const cx = (maxX + minX) / 2;
       const cy = (maxY + minY) / 2;
       const cz = (maxZ + minZ) / 2;
       return { sizeX, sizeY, sizeZ, cx, cy, cz };
    }

    // Phase 1, 2, 3: 實體原子渲染
    function AtomView({ atoms, visible, opacity = 1.0 }) {
      const meshRef = useRef();
      const dummy = useMemo(() => new THREE.Object3D(), []);
      
      // 使用 useLayoutEffect 解決「剛載入時全白無色」的閃爍問題，並且套用完美色彩對應
      useLayoutEffect(() => {
        if (!meshRef.current || !atoms || atoms.length === 0) return;
        atoms.forEach((atom, i) => {
          dummy.position.set(...atom.pos);
          dummy.scale.setScalar(atom.radius * 0.9);
          dummy.updateMatrix();
          meshRef.current.setMatrixAt(i, dummy.matrix);
          
          let hexColor = '#cccccc'; // 預設顏色
          if (atom.type === 'O') hexColor = '#ff3333';
          else if (atom.type === 'N') hexColor = '#3333ff';
          else if (atom.type === 'S') hexColor = '#ffcc33';
          else if (atom.type === 'H') hexColor = '#ffffff';
          else if (atom.type === 'C') hexColor = '#33ff33';
          
          const color = new THREE.Color(hexColor);
          // 【極度降低亮度】將顏色亮度打 4 折 (原本是 0.8)，對抗場景的強光，解決過曝問題
          color.multiplyScalar(0.4); 
          meshRef.current.setColorAt(i, color);
        });
        meshRef.current.instanceMatrix.needsUpdate = true;
        if (meshRef.current.instanceColor) meshRef.current.instanceColor.needsUpdate = true;
      }, [atoms, visible]);

      if (!visible || !atoms || atoms.length === 0) return null;

      // 當透明度小於 1 時，切換為無光照材質，這是產生完美 "幽靈感" 半透明且不互相穿透重疊的最強解法
      return (
        <instancedMesh ref={meshRef} args={[null, null, atoms.length]}>
          <sphereGeometry args={[1, 16, 16]} />
          {opacity < 1.0 ? (
             <meshBasicMaterial 
               transparent={true} 
               opacity={0.15}    /* 把透明度壓到極低，讓群體看起來不會太厚重 */
               depthWrite={false} /* 關閉深度，讓原子團變成背景雲霧 */
             />
          ) : (
             <meshPhongMaterial 
               shininess={30} 
               specular="#444444" 
               transparent={false} 
               opacity={1.0} 
               depthWrite={true} 
             />
          )}
        </instancedMesh>
      );
    }
    // Phase 1 & 6: SES 半透明膜渲染
    function SESView({ visible }) {
      const gltf = useGLTF('./protein_ses.glb');
      const geometry = useMemo(() => {
        if (!gltf.nodes) return null;
        const meshNode = Object.values(gltf.nodes).find(n => n.isMesh);
        if (meshNode && meshNode.geometry) {
          const geo = meshNode.geometry.clone();
          geo.computeVertexNormals();
          return geo;
        }
        return null;
      }, [gltf]);

      if (!visible || !geometry) return null;

      return (
        <mesh geometry={geometry}>
          {/* 【完美對應 PyVista】捨棄物理折射，改用傳統 Alpha 混色模型與 Phong 光照 */}
          <meshPhongMaterial 
            color="#00aaff"           /* 賦予 SES 表面明顯的顏色 */
            transparent={true}
            opacity={0.4}             /* 明確的半透明度 (對應 op_val) */
            shininess={15}            /* 對應您的 specular_power=15 */
            specular="#222222"        /* 對應您的低反光 specular=0.15 */
            side={THREE.FrontSide}    /* 對應您的 culling='back' (背面剔除，只畫正面) */
            depthWrite={false}        /* 關閉深度寫入以確保內部原子不被遮擋 */
          />
        </mesh>
      );
    }
    // Phase 2: 全空間 3D 網格陣列 (覆蓋整個 Bounding Box)
    function GridWireframe({ atoms, visible }) {
      const bounds = useMemo(() => computeTightBounds(atoms, 2.0), [atoms]);

      // 1. 主網格 (Macro Grid) - 2.5Å (較亮，提供整體空間感)
      const macroGeo = useMemo(() => {
        if (!bounds) return null;
        const spacing = 2.5;
        const pts = [];
        const halfX = bounds.sizeX / 2; const halfY = bounds.sizeY / 2; const halfZ = bounds.sizeZ / 2;
        const numX = Math.floor(bounds.sizeX / spacing); const numY = Math.floor(bounds.sizeY / spacing); const numZ = Math.floor(bounds.sizeZ / spacing);
        const startX = - (numX * spacing) / 2; const startY = - (numY * spacing) / 2; const startZ = - (numZ * spacing) / 2;

        for (let j = 0; j <= numY; j++) for (let k = 0; k <= numZ; k++) { pts.push(new THREE.Vector3(-halfX, startY + j * spacing, startZ + k * spacing)); pts.push(new THREE.Vector3(halfX, startY + j * spacing, startZ + k * spacing)); }
        for (let i = 0; i <= numX; i++) for (let k = 0; k <= numZ; k++) { pts.push(new THREE.Vector3(startX + i * spacing, -halfY, startZ + k * spacing)); pts.push(new THREE.Vector3(startX + i * spacing, halfY, startZ + k * spacing)); }
        for (let i = 0; i <= numX; i++) for (let j = 0; j <= numY; j++) { pts.push(new THREE.Vector3(startX + i * spacing, startY + j * spacing, -halfZ)); pts.push(new THREE.Vector3(startX + i * spacing, startY + j * spacing, halfZ)); }
        
        return new THREE.BufferGeometry().setFromPoints(pts);
      }, [bounds]);

      // 2. 副網格 (Micro Grid) - 0.5Å (較暗，且向中心梯度隱形)
      const microGeo = useMemo(() => {
        if (!bounds) return null;
        const spacing = 0.5;
        const pts = [];
        const colors = [];
        
        // 【關鍵優化】：改用包含 Alpha 通道的 RGBA 混色，避免多線疊加發光
        const baseColor = new THREE.Color("#224466"); 
        const maxOpacity = 0.08; // 副網格的極限透明度，設定得非常非常淡
        
        const halfX = bounds.sizeX / 2; const halfY = bounds.sizeY / 2; const halfZ = bounds.sizeZ / 2;
        const numX = Math.floor(bounds.sizeX / spacing); const numY = Math.floor(bounds.sizeY / spacing); const numZ = Math.floor(bounds.sizeZ / spacing);
        const startX = - (numX * spacing) / 2; const startY = - (numY * spacing) / 2; const startZ = - (numZ * spacing) / 2;

        const getFade = (x, y, z) => {
            const fx = Math.abs(x) / halfX;
            const fy = Math.abs(y) / halfY;
            const fz = Math.abs(z) / halfZ;
            const maxDist = Math.max(fx, fy, fz);
            return Math.pow(maxDist, 4); // 4次方，讓內部大部分區域接近完全透明
        };

        const addLine = (x1, y1, z1, x2, y2, z2) => {
            pts.push(x1, y1, z1, x2, y2, z2);
            
            const fade1 = getFade(x1, y1, z1);
            const fade2 = getFade(x2, y2, z2);
            
            // 寫入 R, G, B, A 四個數值
            colors.push(baseColor.r, baseColor.g, baseColor.b, fade1 * maxOpacity);
            colors.push(baseColor.r, baseColor.g, baseColor.b, fade2 * maxOpacity);
        };

        for (let j = 0; j <= numY; j++) for (let k = 0; k <= numZ; k++) addLine(-halfX, startY + j * spacing, startZ + k * spacing, halfX, startY + j * spacing, startZ + k * spacing);
        for (let i = 0; i <= numX; i++) for (let k = 0; k <= numZ; k++) addLine(startX + i * spacing, -halfY, startZ + k * spacing, startX + i * spacing, halfY, startZ + k * spacing);
        for (let i = 0; i <= numX; i++) for (let j = 0; j <= numY; j++) addLine(startX + i * spacing, startY + j * spacing, -halfZ, startX + i * spacing, startY + j * spacing, halfZ);
        
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
        geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 4)); // 設定 itemSize = 4 來支援透明度
        return geo;
      }, [bounds]);

      const boxGeo = useMemo(() => {
        if (!bounds) return null;
        return new THREE.BoxGeometry(bounds.sizeX, bounds.sizeY, bounds.sizeZ);
      }, [bounds]);

      if (!visible || !bounds) return null;

      return (
        <group position={[bounds.cx, bounds.cy, bounds.cz]}>
          <boxHelper args={[new THREE.Mesh(boxGeo)]} color="#081824" renderOrder={-1} />
          
          {/* 1. 副網格 Micro Grid (0.5A) */}
          <lineSegments geometry={microGeo} renderOrder={-1}>
            <lineBasicMaterial 
              vertexColors={true} 
              transparent={true} 
              blending={THREE.NormalBlending} 
              depthWrite={false} 
            />
          </lineSegments>

          {/* 2. 主網格 Macro Grid (2.5A) */}
          <lineSegments geometry={macroGeo} renderOrder={-1}>
            <lineBasicMaterial 
              color="#113355" 
              transparent={true} 
              opacity={0.12} 
              depthWrite={false} 
            />
          </lineSegments>

        </group>
      );
    }

    // Phase 3, 4, 5: 網格動畫掃描器
    function AlgorithmScanner({ algoData, atoms, phase }) {
      const [scanPos, setScanPos] = useState(0);
      
      // 1. 建立 Ref 以便在動畫幀中動態控制繪製範圍
      const solventGeoRef = useRef();
      const proteinGeoRef = useRef();
      const cavityGeoRef = useRef();
      
      // 自我判斷是否應該顯示
      const visible = phase >= 3 && phase <= 5;
      
      // 自我計算最合身的掃描邊界框
      const bounds = useMemo(() => computeTightBounds(atoms, 2.0), [atoms]);

      // 提取並過濾三種點陣資料 (只保留在 Bounding Box 內的點)
      // 【關鍵修改】：過濾後，根據 X 座標「由左至右」進行排序，這是掃描揭露效果的核心
      const { solventFiltered, proteinFiltered, cavityFiltered } = useMemo(() => {
        if (!algoData || !algoData.voxels || !bounds) return { 
            solventFiltered: { array: new Float32Array(), count: 0 }, 
            proteinFiltered: { array: new Float32Array(), count: 0 }, 
            cavityFiltered: { array: new Float32Array(), count: 0 } 
        };
        
        const minX = bounds.cx - bounds.sizeX / 2; const maxX = bounds.cx + bounds.sizeX / 2;
        const minY = bounds.cy - bounds.sizeY / 2; const maxY = bounds.cy + bounds.sizeY / 2;
        const minZ = bounds.cz - bounds.sizeZ / 2; const maxZ = bounds.cz + bounds.sizeZ / 2;

        const filterAndSort = (pointsArray) => {
          const res = [];
          for (let i = 0; i < pointsArray.length; i++) {
            const [x, y, z] = pointsArray[i];
            if (x >= minX && x <= maxX && y >= minY && y <= maxY && z >= minZ && z <= maxZ) {
              res.push({x, y, z});
            }
          }
          // 依照 X 座標由小到大排序
          res.sort((a, b) => a.x - b.x);
          
          const flat = new Float32Array(res.length * 3);
          for(let i = 0; i < res.length; i++) {
            flat[i*3] = res[i].x; flat[i*3+1] = res[i].y; flat[i*3+2] = res[i].z;
          }
          return { array: flat, count: res.length };
        };

        return {
          solventFiltered: filterAndSort(algoData.voxels.solvent || []),
          proteinFiltered: filterAndSort(algoData.voxels.protein || []),
          cavityFiltered: filterAndSort(algoData.voxels.cavity || [])
        };
      }, [algoData, bounds]);

      // Phase 3 黃色邊界框
      const boxGeo = useMemo(() => {
        if (!bounds) return null;
        return new THREE.BoxGeometry(bounds.sizeX, bounds.sizeY, bounds.sizeZ);
      }, [bounds]);

      // 【關鍵修改】：二元搜尋法，極速找出當前掃描線 (X座標) 左邊有幾個點
      const findVisibleCount = (array, totalCount, currentX) => {
        let left = 0;
        let right = totalCount - 1;
        let ans = 0;
        while(left <= right) {
          const mid = Math.floor((left + right) / 2);
          if (array[mid * 3] <= currentX) {
            ans = mid + 1;
            left = mid + 1;
          } else {
            right = mid - 1;
          }
        }
        return ans;
      };

      // 掃描動畫邏輯與動態點位顯示
      useFrame((state, delta) => {
        if (visible && bounds) {
          const startX = bounds.cx - bounds.sizeX / 2;
          const endX = bounds.cx + bounds.sizeX / 2;
          
          setScanPos(prev => {
            const nextPos = prev + 12.0 * delta; // 掃描速度
            const finalPos = (nextPos > endX || prev < startX) ? startX : nextPos;
            
            // 【關鍵修改】：利用 setDrawRange 即時控制只畫出掃描線左側的點 (掃描揭露效果)
            if (solventGeoRef.current) solventGeoRef.current.setDrawRange(0, findVisibleCount(solventFiltered.array, solventFiltered.count, finalPos));
            if (proteinGeoRef.current) proteinGeoRef.current.setDrawRange(0, findVisibleCount(proteinFiltered.array, proteinFiltered.count, finalPos));
            if (cavityGeoRef.current) cavityGeoRef.current.setDrawRange(0, findVisibleCount(cavityFiltered.array, cavityFiltered.count, finalPos));

            return finalPos;
          });
        }
      });

      if (!visible) return null;

      return (
        <group>
          {/* Phase 3 專屬的黃色邊界框 */}
          {bounds && phase === 3 && (
            <group position={[bounds.cx, bounds.cy, bounds.cz]}>
              <boxHelper args={[new THREE.Mesh(boxGeo)]} color="#ffee00" renderOrder={-1} />
            </group>
          )}

          {/* 1. 溶劑區 (Solvent) - 乾淨的淡冰藍色 */}
          <points>
            <bufferGeometry ref={solventGeoRef}>
              <bufferAttribute attach="attributes-position" count={solventFiltered.count} array={solventFiltered.array} itemSize={3} />
            </bufferGeometry>
            <pointsMaterial color="#add8e6" size={0.4} transparent={true} opacity={0.25} depthWrite={false} />
          </points>

          {/* 2. 蛋白質實體區 (Protein) - 改為灰白色避免與碳衝突 */}
          <points>
            <bufferGeometry ref={proteinGeoRef}>
              <bufferAttribute attach="attributes-position" count={proteinFiltered.count} array={proteinFiltered.array} itemSize={3} />
            </bufferGeometry>
            <pointsMaterial color="#667788" size={0.6} transparent={true} opacity={0.5} toneMapped={false} depthWrite={false} />
          </points>

          {/* 3. 結合口袋區 (Cavity) - 改為高亮的青色 (Cyan) */}
          <points renderOrder={1}>
            <bufferGeometry ref={cavityGeoRef}>
              <bufferAttribute attach="attributes-position" count={cavityFiltered.count} array={cavityFiltered.array} itemSize={3} />
            </bufferGeometry>
            <pointsMaterial color="#00ffff" size={0.8} transparent={true} opacity={1.0} toneMapped={false} depthWrite={false} depthTest={false} />
          </points>

          {/* 掃描線平面 - 尺寸完美貼合 Box */}
          {bounds && (
            <mesh position={[scanPos, bounds.cy, bounds.cz]} rotation={[0, Math.PI / 2, 0]}>
              <planeGeometry args={[bounds.sizeZ, bounds.sizeY]} />
              <meshBasicMaterial color="#00ffff" transparent={true} opacity={0.3} side={THREE.DoubleSide} depthWrite={false} />
            </mesh>
          )}
        </group>
      );
    }

    // Phase 6: 口袋平滑 Mesh
    function PocketMesh({ meshData, visible }) {
      const geometry = useMemo(() => {
        if (!meshData || !meshData.vertices || meshData.vertices.length === 0) return null;
        const geo = new THREE.BufferGeometry();
        const verts = new Float32Array(meshData.vertices.flat());
        const indices = new Uint16Array(meshData.faces.flat());
        geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
        geo.setIndex(new THREE.BufferAttribute(indices, 1));
        geo.computeVertexNormals();
        return geo;
      }, [meshData]);

      if (!visible || !geometry) return null;

      return (
        <mesh geometry={geometry}>
          <meshPhysicalMaterial 
            color="#00ffcc" transmission={0.6} opacity={1} transparent={true}
            roughness={0.2} thickness={1.5} emissive="#004433" side={THREE.DoubleSide}
          />
        </mesh>
      );
    }

    function App() {
      const [data, setData] = useState(null);
      const [error, setError] = useState(null);
      const [phase, setPhase] = useState(1);
      const [phase1Opts, setPhase1Opts] = useState({ vdw: true, ses: true });

      useEffect(() => {
        fetch('./precomputed_data.json')
          .then(res => {
            if (!res.ok) throw new Error(`找不到 precomputed_data.json`);
            return res.json();
          })
          .then(setData)
          .catch(err => setError(err.toString()));
      }, []);

      if (error) return <div className="loading" style={{color: '#ff4444'}}>載入失敗: {error}</div>;
      if (!data) return <div className="loading">載入預先計算資產中...</div>;

      return (
        <ErrorBoundary>
          <div className="ui-panel">
            <h2>POCKET ALGORITHM PIPELINE</h2>
            
            <button className={`phase-btn ${phase === 1 ? 'active' : ''}`} onClick={() => setPhase(1)}>
              Phase 1: 結構視覺化
            </button>
            {phase === 1 && (
              <div className="sub-options">
                <button className={`sub-btn ${phase1Opts.vdw ? 'active' : ''}`} onClick={() => setPhase1Opts(p => ({...p, vdw: !p.vdw}))}>VDW 原子</button>
                <button className={`sub-btn ${phase1Opts.ses ? 'active' : ''}`} onClick={() => setPhase1Opts(p => ({...p, ses: !p.ses}))}>SES 表面</button>
              </div>
            )}
            
            <button className={`phase-btn ${phase === 2 ? 'active' : ''}`} onClick={() => setPhase(2)}>
              Phase 2: 空間網格化
            </button>
            <button className={`phase-btn ${phase === 3 ? 'active' : ''}`} onClick={() => setPhase(3)}>
              Phase 3: 距離場切面掃描
            </button>
            <button className={`phase-btn ${phase === 4 ? 'active' : ''}`} onClick={() => setPhase(4)}>
              Phase 4: 探針球侵蝕掃描
            </button>
            <button className={`phase-btn ${phase === 5 ? 'active' : ''}`} onClick={() => setPhase(5)}>
              Phase 5: 聯集探針可行區
            </button>
            <button className={`phase-btn ${phase === 6 ? 'active' : ''}`} onClick={() => setPhase(6)}>
              Phase 6: 表面平滑化
            </button>
          </div>
          
          {phase >= 3 && phase <= 5 && (
             <div className="legend">
               <div className="legend-item"><div className="color-box" style={{background: '#add8e6'}}></div> 溶劑區 (Solvent)</div>
               <div className="legend-item"><div className="color-box" style={{background: '#aaaaaa'}}></div> 蛋白區 (Protein)</div>
               <div className="legend-item"><div className="color-box" style={{background: '#00ffff'}}></div> 空腔區 (Cavity)</div>
               {phase >= 4 && <div className="legend-item"><div className="color-box" style={{background: '#00ff00', boxShadow: '0 0 10px #00ff00'}}></div> 探針區 (Probe Valid)</div>}
             </div>
          )}

          <Canvas camera={{ position: [0, 0, 35], fov: 45 }}>
            <color attach="background" args={['#030508']} />
            <OrbitControls autoRotate={phase === 6 || phase === 1} autoRotateSpeed={0.5} makeDefault />
            
            {/* 1. 大幅降低環境光 (由 2.0 降至 0.6) - 恢復原子的陰影與鮮豔色彩 */}
            <ambientLight intensity={0.6} />
            
            {/* 2. 主光源 (由 3.0 降至 1.5) - 提供立體感，不會將表面照到發白 */}
            <directionalLight position={[20, 20, 20]} intensity={1.5} />
            
            {/* 3. 背面輪廓光 (由 1.5 降至 0.8) - 專門勾勒 SES 邊緣的漂亮藍光 */}
            <directionalLight position={[-20, -10, -20]} intensity={0.8} color="#00f0ff" />
            
            {/* 4. 頂部輔助光 (由 2.5 降至 0.8) - 柔和提亮整體 */}
            <pointLight position={[0, 20, 0]} intensity={0.8} color="#ffffff" />
            
            <Suspense fallback={null}>
              <group position={[0,0,0]}>
                
                {/* Phase 1: 實體/透明雙模式 & Phase 2, 3: 背景半透明原子 */}
                <AtomView 
                  atoms={data.atoms} 
                  visible={(phase === 1 && phase1Opts.vdw) || phase === 2 || phase === 3} 
                  opacity={(phase === 2 || phase === 3) ? 0.2 : 1.0} 
                />
                <SESView visible={phase === 1 && phase1Opts.ses} />
                
                {/* Phase 2: 長方體完美合身網格 */}
                <GridWireframe algoData={data.algo_data} atoms={data.atoms} visible={phase === 2} />
                
                {/* Phase 3, 4, 5: 動畫掃描器 (動態綁定合身邊界框進行掃描) */}
                <AlgorithmScanner algoData={data.algo_data} atoms={data.atoms} phase={phase} />
                
                {/* Phase 6: 口袋 Mesh 呈現 */}
                <PocketMesh meshData={data.algo_data.pocket_mesh} visible={phase === 6} />
                <SESView visible={phase === 6} /> 
                
              </group>
            </Suspense>
          </Canvas>
        </ErrorBoundary>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
