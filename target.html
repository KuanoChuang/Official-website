<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Scanner Visualizer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030508;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        #root {
            width: 100vw;
            height: 100vh;
        }

        .ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 320px;
            background: rgba(10, 15, 30, 0.85);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
        }

        .ui-panel h2 {
            color: #fff;
            margin: 0 0 10px 0;
            font-size: 15px;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
        }

        .phase-btn {
            background: rgba(255, 255, 255, 0.05);
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            text-align: left;
            transition: all 0.2s;
            font-size: 13px;
        }

        .phase-btn:hover {
            background: rgba(0, 240, 255, 0.1);
            color: #fff;
            border-color: #00f0ff;
        }

        .phase-btn.active {
            background: #00f0ff;
            color: #000;
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            font-weight: bold;
        }

        .sub-options {
            display: flex;
            gap: 10px;
            margin-top: 5px;
            margin-bottom: 5px;
        }

        .sub-btn {
            flex: 1;
            padding: 6px;
            font-size: 11px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }

        .sub-btn:hover {
            background: rgba(255, 0, 119, 0.3);
        }

        .sub-btn.active {
            background: #ff0077;
            border-color: #ff0077;
            font-weight: bold;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00f0ff;
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: #fff;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-box {
            width: 15px;
            height: 15px;
            border-radius: 3px;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                "three": "https://esm.sh/three@0.150.0",
                "three/examples/jsm/": "https://esm.sh/three@0.150.0/examples/jsm/",
                "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.13.0?external=react,react-dom,three",
                "@react-three/drei": "https://esm.sh/@react-three/drei@9.70.0?external=react,react-dom,three,@react-three/fiber"
            }
        }
</script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel" data-type="module">
        import React, { useRef, useState, useEffect, useLayoutEffect, useMemo, Suspense } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Canvas, useFrame } from '@react-three/fiber';
        import { OrbitControls, useGLTF, Sphere, Line } from '@react-three/drei';
        import * as THREE from 'three';
        import * as BufferGeometryUtils from 'three/examples/jsm/utils/BufferGeometryUtils.js';

        class Boundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div style={{ position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -50%)', color: '#ff4444', backgroundColor: 'rgba(0,0,0,0.9)', padding: '30px', borderRadius: '10px', zIndex: 100, border: '1px solid #ff4444' }}>
                            <h3>渲染崩潰</h3>
                            <pre style={{ whiteSpace: 'pre-wrap', fontSize: '12px' }}>{this.state.error.message}</pre>
                        </div>
                    );
                }
                return this.props.children;
            }
        }
        // 計算box邊界
        function computeTightBounds(atoms, padding = 2.0) {
            if (!atoms || atoms.length === 0) return { sizeX: 20, sizeY: 20, sizeZ: 20, cx: 0, cy: 0, cz: 0 };
            let minX = 9999, minY = 9999, minZ = 9999;
            let maxX = -9999, maxY = -9999, maxZ = -9999;
            atoms.forEach(a => {
                const r = a.radius || 1.5;
                minX = Math.min(minX, a.pos[0] - r);
                minY = Math.min(minY, a.pos[1] - r);
                minZ = Math.min(minZ, a.pos[2] - r);
                maxX = Math.max(maxX, a.pos[0] + r);
                maxY = Math.max(maxY, a.pos[1] + r);
                maxZ = Math.max(maxZ, a.pos[2] + r);
            });
            const sizeX = (maxX - minX) + padding * 2;
            const sizeY = (maxY - minY) + padding * 2;
            const sizeZ = (maxZ - minZ) + padding * 2;
            const cx = (maxX + minX) / 2;
            const cy = (maxY + minY) / 2;
            const cz = (maxZ + minZ) / 2;
            return { sizeX, sizeY, sizeZ, cx, cy, cz };
        }
        // Phase 1, 2, 3: 實體原子渲染
        function AtomView({ atoms, visible, dimmed = false }) {
            const meshRef = useRef();
            const dummy = useMemo(() => new THREE.Object3D(), []);
            useLayoutEffect(() => {
                if (!meshRef.current || !atoms || atoms.length === 0) return;
                atoms.forEach((atom, i) => {
                    dummy.position.set(...atom.pos);
                    dummy.scale.setScalar(atom.radius * 0.9);
                    dummy.updateMatrix();
                    meshRef.current.setMatrixAt(i, dummy.matrix);

                    let hexColor = '#cccccc'; // 預設顏色
                    if (atom.type === 'O') hexColor = '#ff3333';
                    else if (atom.type === 'N') hexColor = '#3333ff';
                    else if (atom.type === 'S') hexColor = '#ffcc33';
                    else if (atom.type === 'H') hexColor = '#ffffff';
                    else if (atom.type === 'C') hexColor = '#33ff33';

                    const color = new THREE.Color(hexColor);
                    color.multiplyScalar(0.4);
                    meshRef.current.setColorAt(i, color);
                });
                meshRef.current.instanceMatrix.needsUpdate = true;
                if (meshRef.current.instanceColor) meshRef.current.instanceColor.needsUpdate = true;
            }, [atoms, visible]);

            if (!visible || !atoms || atoms.length === 0) return null;
            return (
                <instancedMesh ref={meshRef} args={[null, null, atoms.length]}>
                    <sphereGeometry args={[1, 16, 16]} />
                    {!dimmed ? (
                        <meshPhongMaterial
                            shininess={30}
                            specular="#444444"
                            transparent={false}
                            opacity={1.0}
                            depthWrite={true}
                        />
                    ) : (
                        <meshBasicMaterial
                            transparent={true}
                            opacity={0.15}    /* 把透明度壓到極低，讓群體看起來不會太厚重 */
                            depthWrite={false} /* 關閉深度，讓原子團變成背景雲霧 */
                        />
                    )}
                </instancedMesh>
            );
        }
        // Phase 1 & 5: SES 半透明膜渲染
        function SESView({ visible, probeProgressRef, phase }) {
            const gltf = useGLTF('./protein_ses.glb');

            const customMaterial = useMemo(() => {
                const mat = new THREE.MeshPhysicalMaterial({
                    color: "#00aaff",
                    transparent: true,
                    transmission: 0.8,
                    opacity: 1.0,
                    roughness: 0.1,
                    thickness: 0.5,
                    side: THREE.DoubleSide,
                    depthWrite: false,
                });

                mat.onBeforeCompile = (shader) => {
                    shader.uniforms.uProbeY = { value: -9999.0 };

                    shader.vertexShader = `
                varying vec3 vPosition;
                ${shader.vertexShader}
                `.replace(
                        `#include <begin_vertex>`,
                        `
                        #include <begin_vertex>
                        vPosition = position;
                        `
                    );

                    shader.fragmentShader = `
                uniform float uProbeY; 
                varying vec3 vPosition;
                ${shader.fragmentShader}
            `.replace(
                        `#include <dithering_fragment>`,
                        `
                #include <dithering_fragment>
                
                // 使用 smoothstep 創造 0.5Å 寬度的柔和顯現邊緣
                float alpha = 1.0 - smoothstep(uProbeY - 0.5, uProbeY + 0.5, vPosition.y);
                gl_FragColor.a *= alpha;
                `
                    );
                    mat.userData.shader = shader;
                };
                return mat;
            }, []);

            const geometry = useMemo(() => {
                if (!gltf.nodes) return null;
                const meshNode = Object.values(gltf.nodes).find(n => n.isMesh);
                if (meshNode && meshNode.geometry) {
                    const geo = meshNode.geometry.clone();
                    geo.computeVertexNormals();
                    return geo;
                }
                return null;
            }, [gltf]);

            useFrame(() => {
                if (!customMaterial.userData.shader) return;
                if (phase !== 1) {
                    customMaterial.userData.shader.uniforms.uProbeY.value = 9999.0;
                } else if (probeProgressRef && probeProgressRef.current && probeProgressRef.current.currentY !== undefined) {

                    customMaterial.userData.shader.uniforms.uProbeY.value = probeProgressRef.current.currentY;
                }
            });

            if (!visible || !geometry) return null;
            return <mesh geometry={geometry} material={customMaterial} />;
        }
        function ProbeScannerView({ probePath, visible, probeProgressRef }) {
            const r_probe = 1.4;

            const sasCurve = useMemo(() => {
                if (!probePath || probePath.length < 2) return null;
                const pathPoints = probePath.map(p => new THREE.Vector3(p[0], p[1], p[2]));
                return new THREE.CatmullRomCurve3(pathPoints, false, 'centripetal', 0.2);
            }, [probePath]);

            if (!visible || !sasCurve) return null;

            return (
                <group>
                    <AnimatedProbe curve={sasCurve} radius={r_probe} probeProgressRef={probeProgressRef} />
                </group>
            );
        }
        function AnimatedProbe({ curve, radius, probeProgressRef }) {
            const probeRef = useRef();

            useFrame(({ clock }) => {
                if (!probeRef.current || !curve) return;

                const speed = 0.05;
                let t = (clock.elapsedTime * speed) % 1;

                const position = curve.getPointAt(t);
                probeRef.current.position.copy(position);
                if (probeProgressRef && probeProgressRef.current) {
                    probeProgressRef.current.currentY = position.y;
                }
            });

            return (
                <mesh ref={probeRef}>
                    <sphereGeometry args={[radius, 16, 16]} />
                    <meshBasicMaterial
                        color="#ffffff"
                        wireframe={true}
                        transparent={true}
                        opacity={0.8}
                        depthTest={false}
                    />
                </mesh>
            );
        }
        // Phase 2: 全空間 3D 網格陣列 (覆蓋整個 Bounding Box)
        function GridWireframe({ algoData, atoms, visible, bounds }) {
            const microMatRef = useRef();
            const macroMatRef = useRef();

            // 1. 主網格 (Macro Grid) - 2.5Å
            const macroGeo = useMemo(() => {
                if (!bounds) return null;
                const spacing = 2.5;
                const pts = [];
                const halfX = bounds.sizeX / 2; const halfY = bounds.sizeY / 2; const halfZ = bounds.sizeZ / 2;
                const numX = Math.floor(bounds.sizeX / spacing); const numY = Math.floor(bounds.sizeY / spacing); const numZ = Math.floor(bounds.sizeZ / spacing);
                const startX = - (numX * spacing) / 2; const startY = - (numY * spacing) / 2; const startZ = - (numZ * spacing) / 2;

                for (let j = 0; j <= numY; j++) for (let k = 0; k <= numZ; k++) { pts.push(new THREE.Vector3(-halfX, startY + j * spacing, startZ + k * spacing)); pts.push(new THREE.Vector3(halfX, startY + j * spacing, startZ + k * spacing)); }
                for (let i = 0; i <= numX; i++) for (let k = 0; k <= numZ; k++) { pts.push(new THREE.Vector3(startX + i * spacing, -halfY, startZ + k * spacing)); pts.push(new THREE.Vector3(startX + i * spacing, halfY, startZ + k * spacing)); }
                for (let i = 0; i <= numX; i++) for (let j = 0; j <= numY; j++) { pts.push(new THREE.Vector3(startX + i * spacing, startY + j * spacing, -halfZ)); pts.push(new THREE.Vector3(startX + i * spacing, startY + j * spacing, halfZ)); }

                return new THREE.BufferGeometry().setFromPoints(pts);
            }, [bounds]);

            // 2. 副網格 (Micro Grid) - 0.5Å
            const microGeo = useMemo(() => {
                if (!bounds) return null;
                const spacing = 0.5;
                const pts = [];

                const halfX = bounds.sizeX / 2; const halfY = bounds.sizeY / 2; const halfZ = bounds.sizeZ / 2;
                const numX = Math.floor(bounds.sizeX / spacing); const numY = Math.floor(bounds.sizeY / spacing); const numZ = Math.floor(bounds.sizeZ / spacing);
                const startX = - (numX * spacing) / 2; const startY = - (numY * spacing) / 2; const startZ = - (numZ * spacing) / 2;

                const addLine = (x1, y1, z1, x2, y2, z2) => {
                    pts.push(x1, y1, z1, x2, y2, z2);
                };

                for (let j = 0; j <= numY; j++) for (let k = 0; k <= numZ; k++) addLine(-halfX, startY + j * spacing, startZ + k * spacing, halfX, startY + j * spacing, startZ + k * spacing);
                for (let i = 0; i <= numX; i++) for (let k = 0; k <= numZ; k++) addLine(startX + i * spacing, -halfY, startZ + k * spacing, startX + i * spacing, halfY, startZ + k * spacing);
                for (let i = 0; i <= numX; i++) for (let j = 0; j <= numY; j++) addLine(startX + i * spacing, startY + j * spacing, -halfZ, startX + i * spacing, startY + j * spacing, halfZ);

                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
                return geo;
            }, [bounds]);

            // Shader 共用變數
            const uniforms = useMemo(() => {
                if (!bounds) return {};
                return {
                    uTime: { value: 0 },
                    uBoundingBox: { value: new THREE.Vector3(bounds.sizeX, bounds.sizeY, bounds.sizeZ) },
                    uLaserColor: { value: new THREE.Color("#00c3ff") }, // 強烈雷射青藍
                    uLaserOpacity: { value: 0.6 },
                    uAfterglowColor: { value: new THREE.Color("#004f8c") }, // 稍微偏暗的科技藍
                    uAfterglowOpacity: { value: 0.15 }, // 殘影透明度
                };
            }, [bounds]);

            useFrame((state) => {
                const time = state.clock.elapsedTime;
                if (microMatRef.current) microMatRef.current.uniforms.uTime.value = time;
                if (macroMatRef.current) macroMatRef.current.uniforms.uTime.value = time;
            });

            // 核心 Shader：控制推進面、留下平滑漸退的殘影軌跡
            const laserShader = {
                vertexShader: `
            varying vec3 vPos;
            void main() {
                vPos = position;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
                fragmentShader: `
            uniform float uTime;
            uniform vec3 uBoundingBox;
            uniform vec3 uLaserColor;
            uniform vec3 uAfterglowColor;
            uniform vec3 uBaseColor;
            uniform float uBaseOpacity;
            uniform float uLaserOpacity;
            uniform float uAfterglowOpacity;
            
            varying vec3 vPos;

            void main() {
                // 1. 週期剛好等於 BoundingBox 大小，消除框外等待時間
                float cycleX = uBoundingBox.x;
                float cycleY = uBoundingBox.y;
                float cycleZ = uBoundingBox.z;

                // 2. 速度設定為質數比例，防止週期頻繁重合
                float speedX = 13.0;
                float speedY = 11.0;
                float speedZ = 17.0;

                // 3. 加入相位偏移 (例如 + cycleY * 0.3)，讓三軸從不同位置開始掃描
                float scanX = mod(uTime * speedX, cycleX) - (cycleX * 0.5);
                float scanY = (cycleY * 0.5) - mod(uTime * speedY + (cycleY * 0.33), cycleY); 
                float scanZ = mod(uTime * speedZ + (cycleZ * 0.66), cycleZ) - (cycleZ * 0.5);

                // ============ 1. 第一核心：計算雷射最前線 (強光) ============
                float thickness = 0.25;
                float laserX = 1.0 - smoothstep(0.0, thickness, abs(vPos.x - scanX));
                float laserY = 1.0 - smoothstep(0.0, thickness, abs(vPos.y - scanY));
                float laserZ = 1.0 - smoothstep(0.0, thickness, abs(vPos.z - scanZ));
                float laserIntensity = max(max(laserX, laserY), laserZ);

                // ============ 2. 第二核心：計算經過後的殘像 ============
                float distToTrailX = (vPos.x < scanX) ? (scanX - vPos.x) : 9999.0;
                float distToTrailY = (vPos.y > scanY) ? (vPos.y - scanY) : 9999.0;
                float distToTrailZ = (vPos.z < scanZ) ? (scanZ - vPos.z) : 9999.0;

                float trailFadeX = clamp(1.0 - (distToTrailX / uBoundingBox.x), 0.0, 1.0);
                float trailFadeY = clamp(1.0 - (distToTrailY / uBoundingBox.y), 0.0, 1.0);
                float trailFadeZ = clamp(1.0 - (distToTrailZ / uBoundingBox.z), 0.0, 1.0);

                float trailIntensity = max(max(trailFadeX, trailFadeY), trailFadeZ);

                // 邊緣漸隱防穿幫 (外圍淡出)
                vec3 normPos = abs(vPos) / (uBoundingBox / 2.0);
                float maxDist = max(max(normPos.x, normPos.y), normPos.z);
                float edgeFade = 1.0 - smoothstep(0.7, 1.0, maxDist);

                // ============ 3. 混合運算 ============
                vec3 mixedColor = mix(uBaseColor, uAfterglowColor, trailIntensity);
                vec3 finalColor = mix(mixedColor, uLaserColor, laserIntensity);

                float finalOpacity = (uBaseOpacity + (trailIntensity * uAfterglowOpacity) + (laserIntensity * uLaserOpacity)) * edgeFade;

                gl_FragColor = vec4(finalColor, finalOpacity);
            }
        `
            };

            if (!visible || !bounds) return null;

            return (
                <group position={[bounds.cx, bounds.cy, bounds.cz]}>
                    {/* 副網格 (Micro Grid) */}
                    <lineSegments geometry={microGeo} renderOrder={-1}>
                        <shaderMaterial
                            ref={microMatRef}
                            transparent={true}
                            depthWrite={false}
                            blending={THREE.NormalBlending}
                            uniforms={{
                                ...uniforms,
                                uBaseColor: { value: new THREE.Color("#162233") },
                                uBaseOpacity: { value: 0.03 } // 維持基本暗色底網格
                            }}
                            vertexShader={laserShader.vertexShader}
                            fragmentShader={laserShader.fragmentShader}
                        />
                    </lineSegments>

                    {/* 主網格 (Macro Grid) */}
                    <lineSegments geometry={macroGeo} renderOrder={-1}>
                        <shaderMaterial
                            ref={macroMatRef}
                            transparent={true}
                            depthWrite={false}
                            blending={THREE.NormalBlending}
                            uniforms={{
                                ...uniforms,
                                uBaseColor: { value: new THREE.Color("#1d3b5e") },
                                uBaseOpacity: { value: 0.08 }
                            }}
                            vertexShader={laserShader.vertexShader}
                            fragmentShader={laserShader.fragmentShader}
                        />
                    </lineSegments>
                </group>
            );
        }
        // Phase 3: 網格動畫掃描器
        function AlgorithmScanner({ algoData, phase, bounds }) {
            const [scanAxis, setScanAxis] = useState('x');
            const solventGeoRef = useRef();
            const proteinGeoRef = useRef();
            const activeGeoRef = useRef();
            const scanPlaneRef = useRef();
            const scanState = useRef({ pos: -9999, phase: 'scanning', timer: 0 });
            const visible = phase === 3;
            const sortedData = useMemo(() => {
                if (!algoData || !algoData.voxels || !bounds) return null;
                const minX = bounds.cx - bounds.sizeX / 2; const maxX = bounds.cx + bounds.sizeX / 2;
                const minY = bounds.cy - bounds.sizeY / 2; const maxY = bounds.cy + bounds.sizeY / 2;
                const minZ = bounds.cz - bounds.sizeZ / 2; const maxZ = bounds.cz + bounds.sizeZ / 2;
                const filterAndSort = (pointsArray, axis, isRawActive = false) => {
                    const res = [];
                    for (let i = 0; i < pointsArray.length; i++) {
                        const pt = pointsArray[i];
                        if (!pt) continue;
                        const x = Number(pt[0]);
                        const y = Number(pt[1]);
                        const z = Number(pt[2]);
                        if (x >= minX && x <= maxX && y >= minY && y <= maxY && z >= minZ && z <= maxZ) {
                            res.push({ x, y, z });
                        }
                    }
                    // 依照指定的掃描軸排序
                    res.sort((a, b) => a[axis] - b[axis]);

                    const flat = new Float32Array(res.length * 3);
                    for (let i = 0; i < res.length; i++) {
                        flat[i * 3] = res[i].x;
                        flat[i * 3 + 1] = res[i].y;
                        flat[i * 3 + 2] = res[i].z;
                    }
                    return { array: flat, count: res.length };
                };
                const rawActive = algoData.voxels.active_voxels || [];
                const rawSolvent = algoData.voxels.solvent || [];
                const rawProtein = algoData.voxels.protein || [];

                return {
                    x: {
                        solvent: filterAndSort(rawSolvent, 'x'),
                        protein: filterAndSort(rawProtein, 'x'),
                        active: filterAndSort(rawActive, 'x', true)
                    },
                    y: {
                        solvent: filterAndSort(rawSolvent, 'y'),
                        protein: filterAndSort(rawProtein, 'y'),
                        active: filterAndSort(rawActive, 'y', true)
                    },
                    z: {
                        solvent: filterAndSort(rawSolvent, 'z'),
                        protein: filterAndSort(rawProtein, 'z'),
                        active: filterAndSort(rawActive, 'z', true)
                    }
                };
            }, [algoData, bounds]);

            // 切換軸向時重置 DrawRange
            useEffect(() => {
                if (solventGeoRef.current) solventGeoRef.current.setDrawRange(0, 0);
                if (proteinGeoRef.current) proteinGeoRef.current.setDrawRange(0, 0);
                if (activeGeoRef.current) activeGeoRef.current.setDrawRange(0, 0);
            }, [scanAxis]);

            // 效能優化：二分搜尋找出在目前掃描平面「之前」的點數
            const findVisibleCount = (array, totalCount, currentPos, axisOffset) => {
                let left = 0; let right = totalCount - 1; let ans = 0;
                while (left <= right) {
                    const mid = Math.floor((left + right) / 2);
                    if (array[mid * 3 + axisOffset] <= currentPos) {
                        ans = mid + 1; left = mid + 1;
                    } else {
                        right = mid - 1;
                    }
                }
                return ans;
            };

            // ==========================================
            // 2. 動畫迴圈
            // ==========================================
            useFrame((state, delta) => {
                if (!visible || !bounds || !sortedData) return;

                const axes = ['x', 'y', 'z'];
                const axisIdx = axes.indexOf(scanAxis);
                const offsets = { x: 0, y: 1, z: 2 };
                const currentOffset = offsets[scanAxis];

                const startVals = { x: bounds.cx - bounds.sizeX / 2, y: bounds.cy - bounds.sizeY / 2, z: bounds.cz - bounds.sizeZ / 2 };
                const endVals = { x: bounds.cx + bounds.sizeX / 2, y: bounds.cy + bounds.sizeY / 2, z: bounds.cz + bounds.sizeZ / 2 };

                const start = startVals[scanAxis];
                const end = endVals[scanAxis];

                if (scanState.current.pos === -9999) scanState.current.pos = start;

                if (scanState.current.phase === 'scanning') {
                    scanState.current.pos += 15.0 * delta;
                    if (scanState.current.pos > end) {
                        scanState.current.phase = 'pausing';
                        scanState.current.timer = 0;
                        scanState.current.pos = end;
                    }

                    if (scanPlaneRef.current) {
                        if (scanAxis === 'x') {
                            scanPlaneRef.current.position.set(scanState.current.pos, bounds.cy, bounds.cz);
                            scanPlaneRef.current.rotation.set(0, Math.PI / 2, 0);
                        }
                        if (scanAxis === 'y') {
                            scanPlaneRef.current.position.set(bounds.cx, scanState.current.pos, bounds.cz);
                            scanPlaneRef.current.rotation.set(Math.PI / 2, 0, 0);
                        }
                        if (scanAxis === 'z') {
                            scanPlaneRef.current.position.set(bounds.cx, bounds.cy, scanState.current.pos);
                            scanPlaneRef.current.rotation.set(0, 0, 0);
                        }
                    }

                    const currentData = sortedData[scanAxis];
                    if (solventGeoRef.current) solventGeoRef.current.setDrawRange(0, findVisibleCount(currentData.solvent.array, currentData.solvent.count, scanState.current.pos, currentOffset));
                    if (proteinGeoRef.current) proteinGeoRef.current.setDrawRange(0, findVisibleCount(currentData.protein.array, currentData.protein.count, scanState.current.pos, currentOffset));
                    if (activeGeoRef.current) activeGeoRef.current.setDrawRange(0, findVisibleCount(currentData.active.array, currentData.active.count, scanState.current.pos, currentOffset));

                } else if (scanState.current.phase === 'pausing') {
                    scanState.current.timer += delta;
                    if (scanState.current.timer > 0.6) {
                        scanState.current.phase = 'scanning';
                        const nextAxis = axes[(axisIdx + 1) % 3];
                        scanState.current.pos = startVals[nextAxis];
                        setScanAxis(nextAxis);
                    }
                }
            });

            if (!visible || !sortedData) return null;
            const currentData = sortedData[scanAxis];

            return (
                <group>
                    {/* Solvent */}
                    <points>
                        <bufferGeometry ref={solventGeoRef} key={`solvent-${scanAxis}`}>
                            <bufferAttribute attach="attributes-position" count={currentData.solvent.count} array={currentData.solvent.array} itemSize={3} />
                        </bufferGeometry>
                        <pointsMaterial color="#88ccff" size={0.4} transparent={true} opacity={0.25} depthWrite={false} />
                    </points>

                    {/* Protein */}
                    <points>
                        <bufferGeometry ref={proteinGeoRef} key={`protein-${scanAxis}`}>
                            <bufferAttribute attach="attributes-position" count={currentData.protein.count} array={currentData.protein.array} itemSize={3} />
                        </bufferGeometry>
                        <pointsMaterial color="#ff9933" size={0.6} transparent={true} opacity={0.75} toneMapped={false} depthWrite={false} />
                    </points>

                    {/* Active Voxels */}
                    <points renderOrder={1}>
                        <bufferGeometry ref={activeGeoRef} key={`active-${scanAxis}`}>
                            <bufferAttribute attach="attributes-position" count={currentData.active.count} array={currentData.active.array} itemSize={3} />
                        </bufferGeometry>
                        <pointsMaterial
                            color={scanAxis === 'x' ? "#4db8ff" : scanAxis === 'y' ? "#00F200" : "#F3E91F"}
                            size={0.75}
                            transparent={true}
                            opacity={0.8}
                            toneMapped={false}
                            depthWrite={false}
                        />
                    </points>

                    {/* 掃描平面 (Plane) */}
                    {bounds && (
                        <mesh ref={scanPlaneRef}>
                            {scanAxis === 'x' && <planeGeometry args={[bounds.sizeZ, bounds.sizeY]} />}
                            {scanAxis === 'y' && <planeGeometry args={[bounds.sizeX, bounds.sizeZ]} />}
                            {scanAxis === 'z' && <planeGeometry args={[bounds.sizeX, bounds.sizeY]} />}
                            <meshBasicMaterial
                                color={scanAxis === 'x' ? "#4db8ff" : scanAxis === 'y' ? "#00F200" : "#F3E91F"}
                                transparent={true}
                                opacity={0.3}
                                side={THREE.DoubleSide}
                                depthWrite={false}
                            />
                        </mesh>
                    )}
                </group>
            );
        }
        // Phase 4: 網格動畫掃描器
        function ProbeScanner({ algoData, phase }) {
            const visible = phase === 4;
            const probeRef = useRef();
            const activeInstancedRef = useRef(null);

            // scanAxis: 0=X, 1=Y, 2=Z, 3=展示最終結果(暫停)
            const [scanAxis, setScanAxis] = useState(0);
            const scanState = useRef({ globalIdx: 0, timer: 0, displayTimer: 0 });

            // ==========================================
            // 1. 解析資料 (不變)
            // ==========================================
            const sortedData = useMemo(() => {
                if (!algoData || !algoData.voxels) return null;

                const solventPts = algoData.voxels.solvent || [];
                const solventFlat = new Float32Array(solventPts.length * 3);
                for (let i = 0; i < solventPts.length; i++) {
                    solventFlat[i * 3] = solventPts[i][0] || 0;
                    solventFlat[i * 3 + 1] = solventPts[i][1] || 0;
                    solventFlat[i * 3 + 2] = solventPts[i][2] || 0;
                }

                const proteinPts = algoData.voxels.protein || [];
                const proteinFlat = new Float32Array(proteinPts.length * 3);
                for (let i = 0; i < proteinPts.length; i++) {
                    proteinFlat[i * 3] = proteinPts[i][0] || 0;
                    proteinFlat[i * 3 + 1] = proteinPts[i][1] || 0;
                    proteinFlat[i * 3 + 2] = proteinPts[i][2] || 0;
                }

                const rawActive = algoData.voxels.active_voxels || [];
                const activeCount = rawActive.length;

                const activeFlat = new Float32Array(activeCount * 3);

                const hitXArray = new Float32Array(activeCount);
                const hitYArray = new Float32Array(activeCount);
                const hitZArray = new Float32Array(activeCount);
                const isProbeXArray = new Float32Array(activeCount);
                const isProbeYArray = new Float32Array(activeCount);
                const isProbeZArray = new Float32Array(activeCount);

                const activePts = [];

                for (let i = 0; i < activeCount; i++) {
                    const p = rawActive[i];
                    const x = Number(p[0]) || 0;
                    const y = Number(p[1]) || 0;
                    const z = Number(p[2]) || 0;

                    activeFlat[i * 3] = x;
                    activeFlat[i * 3 + 1] = y;
                    activeFlat[i * 3 + 2] = z;

                    hitXArray[i] = Number(p[3]) || 0;
                    hitYArray[i] = Number(p[4]) || 0;
                    hitZArray[i] = Number(p[5]) || 0;
                    isProbeXArray[i] = Number(p[6]) || 0;
                    isProbeYArray[i] = Number(p[7]) || 0;
                    isProbeZArray[i] = Number(p[8]) || 0;

                    activePts.push({ x, y, z });
                }

                const pathX = [...activePts].sort((a, b) => a.x - b.x);
                const pathY = [...activePts].sort((a, b) => a.y - b.y);
                const pathZ = [...activePts].sort((a, b) => a.z - b.z);

                return {
                    solventCount: solventPts.length, solventArray: solventFlat,
                    proteinCount: proteinPts.length, proteinArray: proteinFlat,
                    activeCount: activeCount, activeArray: activeFlat,
                    hitXArray, hitYArray, hitZArray,
                    isProbeXArray, isProbeYArray, isProbeZArray,
                    paths: [pathX, pathY, pathZ]
                };
            }, [algoData]);

            useEffect(() => {
                setScanAxis(0);
                scanState.current = { globalIdx: 0, timer: 0, displayTimer: 0 };
            }, [algoData]);

            // ==========================================
            // 2. ShaderMaterial
            // ==========================================
            const activeMaterial = useMemo(() => {
                return new THREE.ShaderMaterial({
                    toneMapped: false,
                    uniforms: {
                        currentProbePos: { value: new THREE.Vector3(0, -999, 0) },
                        scanAxis: { value: 0 },
                        layerThickness: { value: 0.8 },
                        worldSize: { value: 0.8 },

                        colorIdle: { value: new THREE.Color("#3a5a78") },
                        colorScanning: { value: new THREE.Color("#ffffff") },

                        // 外殼色彩
                        colorL1_Cavity_X: { value: new THREE.Color("#4db8ff") }, // 青色 (X軸淘汰)
                        colorL2_Cavity_Y: { value: new THREE.Color("#00F200") }, // 綠色 (Y軸淘汰)
                        colorL3_Cavity_Z: { value: new THREE.Color("#F3E91F") }, // 黃色 (Z軸淘汰)

                        // 【紫色三階段：由暗到亮、層層遞進】
                        colorL1_Probe: { value: new THREE.Color("#DB5BBD") },    // 第一階段
                        colorL2_Probe: { value: new THREE.Color("#E16DE1") },    // 第二階段
                        colorL3_Probe: { value: new THREE.Color("#ff00ff") }     // 第三階段
                    },
                    vertexShader: `
                uniform float worldSize;
                
                attribute float hitX; attribute float hitY; attribute float hitZ;
                attribute float isProbeX; attribute float isProbeY; attribute float isProbeZ;
                
                varying vec3 vWorldPosition;
                varying float vHitX; varying float vHitY; varying float vHitZ;
                varying float vIsProbeX; varying float vIsProbeY; varying float vIsProbeZ;

                void main() {
                    vHitX = hitX; vHitY = hitY; vHitZ = hitZ;
                    vIsProbeX = isProbeX; vIsProbeY = isProbeY; vIsProbeZ = isProbeZ;
                    
                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPosition.xyz;
                    vec4 mvPosition = viewMatrix * worldPosition;
                    
                    float sizeAttenuation = 450.0 / max(-mvPosition.z, 0.1);
                    gl_PointSize = worldSize * sizeAttenuation;
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
                    fragmentShader: `
                uniform vec3 currentProbePos;
                uniform int scanAxis;
                uniform float layerThickness;
                
                uniform vec3 colorIdle; uniform vec3 colorScanning;
                uniform vec3 colorL1_Cavity_X; uniform vec3 colorL1_Probe;
                uniform vec3 colorL2_Cavity_Y; uniform vec3 colorL2_Probe;
                uniform vec3 colorL3_Cavity_Z; uniform vec3 colorL3_Probe;

                varying vec3 vWorldPosition;
                varying float vHitX; varying float vHitY; varying float vHitZ;
                varying float vIsProbeX; varying float vIsProbeY; varying float vIsProbeZ;

                void main() {

                    // 1. 判定是否已經過去了 (加入 0.1 的稍大容差，對付 lerp 未到達的問題)
                    bool isPastX = vWorldPosition.x < (currentProbePos.x + 0.1);
                    bool isPastY = vWorldPosition.y < (currentProbePos.y + 0.1);
                    bool isPastZ = vWorldPosition.z < (currentProbePos.z + 0.1);

                    // 判定是否在切面內 (探針的光環範圍)
                    bool inSliceX = abs(vWorldPosition.x - currentProbePos.x) < layerThickness;
                    bool inSliceY = abs(vWorldPosition.y - currentProbePos.y) < layerThickness;
                    bool inSliceZ = abs(vWorldPosition.z - currentProbePos.z) < layerThickness;

                    if (isPastX) inSliceX = false;
                    if (isPastY) inSliceY = false;
                    if (isPastZ) inSliceZ = false;

                    int unlockedLevel = 0;
                    bool isScanningNow = false; 

                    // 2. 解鎖進度
                    if (scanAxis >= 3) {
                        if (vHitX > 0.5) unlockedLevel = 1;
                        if (vHitY > 0.5) unlockedLevel = 2;
                        if (vHitZ > 0.5) unlockedLevel = 3;
                        isScanningNow = false; 
                    } 
                    else if (scanAxis == 0) {
                        if (vHitX > 0.5) {
                            if (isPastX) unlockedLevel = 1; 
                            else if (inSliceX) isScanningNow = true;
                        }
                    } 
                    else if (scanAxis == 1) {
                        if (vHitX > 0.5) unlockedLevel = 1; 
                        if (vHitY > 0.5) {
                            if (isPastY) unlockedLevel = 2;
                            else if (inSliceY) isScanningNow = true;
                        }
                    } 
                    else if (scanAxis == 2) {
                        if (vHitX > 0.5) unlockedLevel = 1;
                        if (vHitY > 0.5) unlockedLevel = 2;
                        if (vHitZ > 0.5) {
                            if (isPastZ) unlockedLevel = 3;
                            else if (inSliceZ) isScanningNow = true;
                        }
                    }

                    // 3. 分配
                    int destiny = 0;
                    if (vHitX > 0.5) {
                        if (vIsProbeX > 0.5) destiny = 1;
                        else destiny = 11;
                    }
                    if (vHitY > 0.5 && destiny != 11) {
                        if (vIsProbeY > 0.5) destiny = 2;
                        else destiny = 12;
                    }
                    if (vHitZ > 0.5 && destiny != 11 && destiny != 12) {
                        if (vIsProbeZ > 0.5) destiny = 3;
                        else destiny = 13;
                    }

                    // 4. 上色 (提升了各階段的核心透明度 alpha)
                    vec3 finalColor = colorIdle;
                    float alpha = 0.05; 

                    if (isScanningNow) {
                        finalColor = colorScanning;
                        alpha = 1.0;
                    } else if (unlockedLevel > 0) {
                        if (unlockedLevel == 1) {
                            if (vHitX > 0.5) {
                                if (vIsProbeX > 0.5) { finalColor = colorL1_Probe; alpha = 0.6; }
                                else { finalColor = colorL1_Cavity_X; alpha = 0.4; }
                            }
                        } 
                        else if (unlockedLevel == 2) {
                            if (destiny == 11) { finalColor = colorL1_Cavity_X; alpha = 0.4; } 
                            else if (vHitY > 0.5) {
                                if (vIsProbeY > 0.5) { finalColor = colorL2_Probe; alpha = 0.8; }
                                else { finalColor = colorL2_Cavity_Y; alpha = 0.6; } 
                            } else {
                                if (vIsProbeX > 0.5) { finalColor = colorL1_Probe; alpha = 0.6; }
                            }
                        } 
                        else if (unlockedLevel == 3) {
                            if (destiny == 11) { finalColor = colorL1_Cavity_X; alpha = 0.4; }
                            else if (destiny == 12) { finalColor = colorL2_Cavity_Y; alpha = 0.6; }
                            else if (vHitZ > 0.5) {
                                if (vIsProbeZ > 0.5) { finalColor = colorL3_Probe; alpha = 1.0; } 
                                else { finalColor = colorL3_Cavity_Z; alpha = 0.8; } 
                            } else {
                                if (destiny == 2) { finalColor = colorL2_Probe; alpha = 0.8; }
                                else if (destiny == 1) { finalColor = colorL1_Probe; alpha = 0.6; }
                            }
                        }
                    }

                    // 將計算出來的線性顏色賦值給 gl_FragColor
                    gl_FragColor = vec4(finalColor, alpha); 
                    
                    #include <tonemapping_fragment>
                    #include <encodings_fragment>
                }
            `,
                    transparent: true,
                    depthWrite: false,
                });
            }, []);

            useLayoutEffect(() => {
                if (!sortedData || !activeInstancedRef.current) return;
                const dummy = new THREE.Object3D();
                if (sortedData.activeCount > 0) {
                    for (let i = 0; i < sortedData.activeCount; i++) {
                        const p = sortedData.activePts[i];
                        dummy.position.set(p.x, p.y, p.z);
                        dummy.updateMatrix();
                        activeInstancedRef.current.setMatrixAt(i, dummy.matrix);
                    }
                    activeInstancedRef.current.instanceMatrix.needsUpdate = true;
                }
            }, [sortedData, visible]);

            // ==========================================
            // 3. 動畫迴圈 (無限循環邏輯)
            // ==========================================
            useFrame((state, delta) => {
                if (!visible || !sortedData || sortedData.activeCount === 0) return;

                // 1. 如果進入展示期 (scanAxis === 3)，計時後重置
                if (scanAxis >= 3) {
                    scanState.current.displayTimer += delta;
                    if (scanState.current.displayTimer > 3.0) { // 停留 3 秒
                        setScanAxis(0);
                        scanState.current.globalIdx = 0;
                        scanState.current.timer = 0;
                        scanState.current.displayTimer = 0;
                    }
                    return;
                }

                const currentPath = sortedData.paths[scanAxis];
                const currentIdx = Math.min(scanState.current.globalIdx, currentPath.length - 1);
                const currentPoint = currentPath[currentIdx];

                // 2. 探針球移動 (只有在有目標點時才 lerp)
                if (currentPoint && probeRef.current) {
                    probeRef.current.position.lerp(new THREE.Vector3(currentPoint.x, currentPoint.y, currentPoint.z), 0.5);
                    probeRef.current.rotation.x += delta * 2.5;
                    probeRef.current.rotation.y += delta * 2.5;
                }

                // 3. 更新 Shader (確保探針位置即時傳入)
                if (activeMaterial && probeRef.current) {
                    activeMaterial.uniforms.scanAxis.value = scanAxis;
                    activeMaterial.uniforms.currentProbePos.value.copy(probeRef.current.position);
                }

                // 4. 推進進度 (不管有沒有 currentPoint，時間都要繼續走！)
                scanState.current.timer += delta;
                if (scanState.current.timer > 0.01) {
                    const step = Math.max(1, Math.floor(currentPath.length / 120));
                    scanState.current.globalIdx += step;
                    scanState.current.timer = 0;

                    // 該軸掃描到底了
                    if (scanState.current.globalIdx >= currentPath.length) {
                        if (activeMaterial) {
                            const farPos = new THREE.Vector3().copy(probeRef.current.position);
                            if (scanAxis === 0) farPos.x += 1000;
                            if (scanAxis === 1) farPos.y += 1000;
                            if (scanAxis === 2) farPos.z += 1000;
                            activeMaterial.uniforms.currentProbePos.value.copy(farPos);
                        }

                        // 重置進度並切換到下一軸
                        scanState.current.globalIdx = 0;
                        setScanAxis(prev => prev + 1); // 0->1, 1->2, 2->3(展示)
                    }
                }
            });

            if (!visible || !sortedData) return null;

            return (
                <group>
                    {sortedData.solventCount > 0 && (
                        <points>
                            <bufferGeometry>
                                <bufferAttribute attach="attributes-position" count={sortedData.solventCount} array={sortedData.solventArray} itemSize={3} />
                            </bufferGeometry>
                            <pointsMaterial color="#88ccff" size={0.4} transparent={true} opacity={0.25} depthWrite={false} />
                        </points>
                    )}

                    {sortedData.proteinCount > 0 && (
                        <points>
                            <bufferGeometry>
                                <bufferAttribute attach="attributes-position" count={sortedData.proteinCount} array={sortedData.proteinArray} itemSize={3} />
                            </bufferGeometry>
                            <pointsMaterial color="#ff9933" size={0.6} transparent={true} opacity={0.75} toneMapped={false} depthWrite={false} />
                        </points>
                    )}

                    {sortedData.activeCount > 0 && (
                        <points renderOrder={1}>
                            <bufferGeometry>
                                <bufferAttribute attach="attributes-position" count={sortedData.activeCount} array={sortedData.activeArray} itemSize={3} />

                                <bufferAttribute attach="attributes-hitX" count={sortedData.activeCount} array={sortedData.hitXArray} itemSize={1} />
                                <bufferAttribute attach="attributes-hitY" count={sortedData.activeCount} array={sortedData.hitYArray} itemSize={1} />
                                <bufferAttribute attach="attributes-hitZ" count={sortedData.activeCount} array={sortedData.hitZArray} itemSize={1} />

                                <bufferAttribute attach="attributes-isProbeX" count={sortedData.activeCount} array={sortedData.isProbeXArray} itemSize={1} />
                                <bufferAttribute attach="attributes-isProbeY" count={sortedData.activeCount} array={sortedData.isProbeYArray} itemSize={1} />
                                <bufferAttribute attach="attributes-isProbeZ" count={sortedData.activeCount} array={sortedData.isProbeZArray} itemSize={1} />
                            </bufferGeometry>
                            <primitive object={activeMaterial} attach="material" />
                        </points>
                    )}

                    {/* 只有在掃描中 (scanAxis < 3) 才顯示實體探針球 */}
                    {scanAxis < 3 && sortedData.activeCount > 0 && (
                        <group ref={probeRef}>
                            <mesh>
                                <sphereGeometry args={[1.4, 16, 16]} />
                                <meshBasicMaterial color="#ffffff" wireframe={true} transparent={true} opacity={0.4} depthTest={false} />
                            </mesh>
                            <mesh>
                                <sphereGeometry args={[0.3, 8, 8]} />
                                <meshBasicMaterial color="#ff33cc" depthTest={false} />
                            </mesh>
                        </group>
                    )}
                </group>
            );
        }
        // Phase 5: 口袋平滑 Mesh
        function PocketMesh({ meshData, visible }) {
            const geometry = useMemo(() => {
                if (!meshData || !meshData.vertices || meshData.vertices.length === 0) return null;

                let geo = new THREE.BufferGeometry();
                const verts = new Float32Array(meshData.vertices.flat());
                const indices = new Uint16Array(meshData.faces.flat());

                geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
                geo.setIndex(new THREE.BufferAttribute(indices, 1));

                // 合併重疊的頂點，容差值可根據模型大小微調（預設為 1e-4）
                geo = BufferGeometryUtils.mergeVertices(geo, 1e-4);

                // 合併頂點後再計算平滑法線
                geo.computeVertexNormals();

                return geo;
            }, [meshData]);

            if (!visible || !geometry) return null;

            return (
                <mesh geometry={geometry}>
                    <meshPhysicalMaterial
                        color="#ff33cc"
                        transmission={0.6}
                        opacity={1}
                        transparent={true}
                        roughness={0.2}
                        thickness={1.5}
                        emissive="#440044"
                        side={THREE.DoubleSide}
                        // 確保 flatShading 為 false（預設即為 false）
                        flatShading={false}
                    />
                </mesh>
            );
        }
        function PocketAnimationSequence({ algoData, meshData }) {
            const [progress, setProgress] = useState(0);
            const [startAnim, setStartAnim] = useState(false);

            const pointsMatRef = useRef();
            const meshMatRef = useRef();
            const meshRef = useRef();

            // --------------------------------------------------------
            // 1. 資料處理：解析點雲
            // --------------------------------------------------------
            const sortedData = useMemo(() => {
                if (!algoData || !algoData.voxels) return null;
                const rawActive = algoData.voxels.active_voxels || [];
                const activeCount = rawActive.length;
                const activeFlat = new Float32Array(activeCount * 3);
                const isProbeZArray = new Float32Array(activeCount);

                for (let i = 0; i < activeCount; i++) {
                    const p = rawActive[i];
                    activeFlat[i * 3] = Number(p[0]) || 0;
                    activeFlat[i * 3 + 1] = Number(p[1]) || 0;
                    activeFlat[i * 3 + 2] = Number(p[2]) || 0;
                    isProbeZArray[i] = Number(p[8]) || 0;
                }
                return { activeCount, activeArray: activeFlat, isProbeZArray };
            }, [algoData]);

            // --------------------------------------------------------
            // 2. 幾何體處理：【優化】保持幾何乾淨，不再 JS 裡破壞頂點
            // --------------------------------------------------------
            const pocketGeometry = useMemo(() => {
                if (!meshData || !meshData.vertices || meshData.vertices.length === 0) return null;
                let geo = new THREE.BufferGeometry();
                const verts = new Float32Array(meshData.vertices.flat());
                geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
                geo.setIndex(new THREE.BufferAttribute(new Uint16Array(meshData.faces.flat()), 1));

                geo = BufferGeometryUtils.mergeVertices(geo, 1e-4);
                geo.computeVertexNormals();
                // 全部交給 Shader 處理，確保拓撲結構 100% 完整不破洞
                return geo;
            }, [meshData]);

            // --------------------------------------------------------
            // 3. 點雲材質：支援顏色過渡
            // --------------------------------------------------------
            const ActiveMaterial = useMemo(() => {
                return new THREE.ShaderMaterial({
                    uniforms: {
                        uOpacity: { value: 1.0 },
                        uSize: { value: 1.0 },
                        worldSize: { value: 0.8 },
                        startColor: { value: new THREE.Color("#ff00ff") },
                        targetColor: { value: new THREE.Color("#a855d4") },
                        uColorProgress: { value: 0.0 }
                    },
                    vertexShader: `
                uniform float worldSize;
                uniform float uSize;
                attribute float isProbeZ;
                varying float vIsProbeZ;
                void main() {
                    vIsProbeZ = isProbeZ;
                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vec4 mvPosition = viewMatrix * worldPosition;
                    float sizeAttenuation = 450.0 / max(-mvPosition.z, 0.1);
                    gl_PointSize = (isProbeZ > 0.5) ? (worldSize * uSize * sizeAttenuation) : 0.0;
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
                    fragmentShader: `
                uniform float uOpacity;
                uniform vec3 startColor;
                uniform vec3 targetColor;
                uniform float uColorProgress;
                varying float vIsProbeZ;
                void main() {
                    if (vIsProbeZ < 0.5) discard; 
                    vec3 finalColor = mix(startColor, targetColor, uColorProgress);
                    gl_FragColor = vec4(finalColor, uOpacity);
                }
            `,
                    transparent: true,
                    depthWrite: false,
                });
            }, []);

            // --------------------------------------------------------
            // 4. 網格材質形變邏輯：【優化】加入動態平整光照 (Flat Shading)
            // --------------------------------------------------------
            const customUniforms = useMemo(() => ({
                uMorphProgress: { value: 0.0 },
                uGridSize: { value: 0.8 } // Voxel 方塊的大小，可根據你的模型尺寸微調 (例如 0.5 或 1.0)
            }), []);

            const voxelColor = useMemo(() => new THREE.Color("#a855d4"), []);
            const smoothColor = useMemo(() => new THREE.Color("#cc88ff"), []);
            const voxelEmissive = useMemo(() => new THREE.Color("#331155"), []);
            const smoothEmissive = useMemo(() => new THREE.Color("#220044"), []);

            const currentColor = useMemo(() => new THREE.Color(), []);
            const currentEmissive = useMemo(() => new THREE.Color(), []);

            const handleMaterialCompile = (shader) => {
                shader.uniforms.uMorphProgress = customUniforms.uMorphProgress;
                shader.uniforms.uGridSize = customUniforms.uGridSize;

                // Vertex Shader：動態階梯化 (Soft Voxelization)
                shader.vertexShader = shader.vertexShader.replace(
                    '#include <common>',
                    `
            #include <common>
            uniform float uMorphProgress;
            uniform float uGridSize;
            `
                );
                shader.vertexShader = shader.vertexShader.replace(
                    '#include <begin_vertex>',
                    `
            // 【修正 1】使用相容性最高的 floor(x + 0.5) 取代 round
            vec3 gridPos = floor((position / uGridSize) + 0.5) * uGridSize;
            
            // 保留 20% 的原始位置，防止三角形面積變成 0 而破洞
            vec3 voxelPos = mix(position, gridPos, 0.8);
            
            // 根據進度在 Voxel 和 平滑網格 之間插值
            float morphEased = smoothstep(0.0, 1.0, uMorphProgress);
            
            // 【修正 2】將 voxelPosition 改回正確的 voxelPos，解決黑屏崩潰！
            vec3 transformed = mix(voxelPos, position, morphEased);
            `
                );

                // Fragment Shader：動態混合光照法線 (Flat -> Smooth)
                shader.fragmentShader = shader.fragmentShader.replace(
                    '#include <common>',
                    `
            #include <common>
            uniform float uMorphProgress;
            `
                );
                shader.fragmentShader = shader.fragmentShader.replace(
                    '#include <normal_fragment_begin>',
                    `
            #include <normal_fragment_begin>
            
            // 透過微分計算幾何的真實切面法線 (Flat Normal)
            vec3 fdx = vec3( dFdx( vViewPosition.x ), dFdx( vViewPosition.y ), dFdx( vViewPosition.z ) );
            vec3 fdy = vec3( dFdy( vViewPosition.x ), dFdy( vViewPosition.y ), dFdy( vViewPosition.z ) );
            vec3 myFlatNormal = normalize( cross( fdx, fdy ) );
            float myFaceDir = gl_FrontFacing ? 1.0 : -1.0;
            myFlatNormal *= myFaceDir;

            // 根據平滑進度，從積木的銳利法線融化成平滑法線
            float normalEased = smoothstep(0.0, 0.6, uMorphProgress);
            normal = normalize( mix( myFlatNormal, normal, normalEased ) );
            `
                );
            };

            // --------------------------------------------------------
            // 5. 動畫排程邏輯
            // --------------------------------------------------------
            useEffect(() => {
                const timer = setTimeout(() => setStartAnim(true), 800);
                return () => clearTimeout(timer);
            }, []);

            function smoothstep(min, max, value) {
                let x = Math.max(0, Math.min(1, (value - min) / (max - min)));
                return x * x * (3 - 2 * x);
            }

            useFrame((state, delta) => {
                if (!startAnim || progress >= 1) return;

                const newProgress = Math.min(progress + delta * 0.25, 1);
                setProgress(newProgress);

                const isPointsPhase = newProgress < 0.2;
                const phase1Progress = Math.min(newProgress * 5, 1.0);

                // 階段一：探針點雲
                if (pointsMatRef.current) {
                    pointsMatRef.current.uniforms.uOpacity.value = 1.0;
                    pointsMatRef.current.uniforms.uSize.value = 1.0 + phase1Progress * 0.5;
                    pointsMatRef.current.uniforms.uColorProgress.value = phase1Progress;
                }

                // 階段二與三：形變與材質實體化
                if (meshMatRef.current && meshRef.current) {
                    const morphProgress = Math.max(0, Math.min((newProgress - 0.2) / 0.6, 1.0));
                    customUniforms.uMorphProgress.value = morphProgress;

                    const colorEased = smoothstep(0.2, 0.8, morphProgress);
                    currentColor.lerpColors(voxelColor, smoothColor, colorEased);
                    meshMatRef.current.color.copy(currentColor);

                    const emissiveEased = smoothstep(0.4, 0.9, morphProgress);
                    currentEmissive.lerpColors(voxelEmissive, smoothEmissive, emissiveEased);
                    meshMatRef.current.emissive.copy(currentEmissive);

                    const targetOpacity = 1.0 - (morphProgress * 0.4);
                    meshMatRef.current.opacity = isPointsPhase ? 0.0 : targetOpacity;

                    const roughEase = Math.pow(morphProgress, 2);
                    meshMatRef.current.roughness = 0.9 - (roughEase * 0.6);
                }
            });

            return (
                <group>
                    {sortedData && sortedData.activeCount > 0 && progress < 0.2 && (
                        <points renderOrder={1}>
                            <bufferGeometry>
                                <bufferAttribute attach="attributes-position" count={sortedData.activeCount} array={sortedData.activeArray} itemSize={3} />
                                <bufferAttribute attach="attributes-isProbeZ" count={sortedData.activeCount} array={sortedData.isProbeZArray} itemSize={1} />
                            </bufferGeometry>
                            <primitive object={ActiveMaterial} attach="material" ref={pointsMatRef} />
                        </points>
                    )}

                    {pocketGeometry && (
                        <mesh geometry={pocketGeometry} ref={meshRef}>
                            <meshPhysicalMaterial
                                ref={meshMatRef}
                                color="#a855d4"
                                emissive="#331155"
                                transmission={0.0}
                                opacity={0}
                                transparent={true}
                                roughness={0.9}
                                thickness={2.0}
                                side={THREE.DoubleSide} // 保留雙面，實體不破洞
                                onBeforeCompile={handleMaterialCompile}
                            />
                        </mesh>
                    )}
                </group>
            );
        }
        function App() {
            const [data, setData] = useState(null);
            const [error, setError] = useState(null);
            const [phase, setPhase] = useState(1);
            const [phase1Opts, setPhase1Opts] = useState({ vdw: true, ses: true });
            const bounds = useMemo(() => {
                if (!data || !data.atoms) return null;
                return computeTightBounds(data.atoms);
            }, [data]);
            const probeProgressRef = useRef({ progress: 0 });

            useEffect(() => {
                fetch('./precomputed_data.json')
                    .then(res => {
                        if (!res.ok) throw new Error(`找不到 precomputed_data.json`);
                        return res.json();
                    })
                    .then(setData)
                    .catch(err => setError(err.toString()));
            }, []);

            if (error) return <div className="loading" style={{ color: '#ff4444' }}>載入失敗: {error}</div>;
            if (!data) return <div className="loading">載入中...</div>;

            return (
                <Boundary>
                    <div className="ui-panel">
                        <h2>Pocket Algorithm</h2>

                        <button className={`phase-btn ${phase === 1 ? 'active' : ''}`} onClick={() => setPhase(1)}>
                            Phase 1: 蛋白實體掃描
                        </button>
                        {phase === 1 && (
                            <div className="sub-options">
                                <button className={`sub-btn ${phase1Opts.vdw ? 'active' : ''}`} onClick={() => setPhase1Opts(p => ({ ...p, vdw: !p.vdw }))}>VDW 原子</button>
                                <button className={`sub-btn ${phase1Opts.ses ? 'active' : ''}`} onClick={() => setPhase1Opts(p => ({ ...p, ses: !p.ses }))}>SES 表面</button>
                            </div>
                        )}
                        <button className={`phase-btn ${phase === 2 ? 'active' : ''}`} onClick={() => setPhase(2)}>
                            Phase 2: 空間網格化
                        </button>
                        <button className={`phase-btn ${phase === 3 ? 'active' : ''}`} onClick={() => setPhase(3)}>
                            Phase 3: 距離場切面掃描
                        </button>
                        <button className={`phase-btn ${phase === 4 ? 'active' : ''}`} onClick={() => setPhase(4)}>
                            Phase 4: 口袋探針球掃描
                        </button>
                        <button className={`phase-btn ${phase === 5 ? 'active' : ''}`} onClick={() => setPhase(5)}>
                            Phase 5: 表面平滑化
                        </button>
                    </div>

                    {(phase === 3 || phase === 4) && (
                        <div
                            className="legend"
                            style={{
                                display: 'grid',
                                // Phase 3 只需要 1 欄，Phase 4 需要 2 欄
                                gridTemplateColumns: phase === 4 ? 'auto auto' : 'auto',
                                gap: '10px 30px', // 上下間距 10px，左右間距 30px
                                alignItems: 'center'
                            }}
                        >
                            {/* 第一排：溶劑 */}
                            <div className="legend-item" style={{ gridRow: 1, gridColumn: 1 }}>
                                <div className="color-box" style={{ background: '#88ccff' }}></div> 溶劑區
                            </div>

                            {/* 第二排：蛋白 + 掃描(如果有的話) */}
                            <div className="legend-item" style={{ gridRow: 2, gridColumn: 1 }}>
                                <div className="color-box" style={{ background: '#ff9933' }}></div> 蛋白區
                            </div>
                            {phase === 4 && (
                                <div className="legend-item" style={{ gridRow: 2, gridColumn: 2 }}>
                                    <div className="color-box" style={{ background: '#ffffff' }}></div> 掃描中
                                </div>
                            )}

                            {/* 第三排：X 軸相關 */}
                            <div className="legend-item" style={{ gridRow: 3, gridColumn: 1 }}>
                                <div className="color-box" style={{ background: '#4db8ff' }}></div> X軸 空腔
                            </div>
                            {phase === 4 && (
                                <div className="legend-item" style={{ gridRow: 3, gridColumn: 2 }}>
                                    <div className="color-box" style={{ background: '#DB5BBD' }}></div> X軸 探針
                                </div>
                            )}

                            {/* 第四排：Y 軸相關 */}
                            <div className="legend-item" style={{ gridRow: 4, gridColumn: 1 }}>
                                <div className="color-box" style={{ background: '#00F200' }}></div> Y軸 空腔
                            </div>
                            {phase === 4 && (
                                <div className="legend-item" style={{ gridRow: 4, gridColumn: 2 }}>
                                    <div className="color-box" style={{ background: '#E16DE1' }}></div> Y軸 探針
                                </div>
                            )}

                            {/* 第五排：Z 軸相關 */}
                            <div className="legend-item" style={{ gridRow: 5, gridColumn: 1 }}>
                                <div className="color-box" style={{ background: '#F3E91F' }}></div> Z軸 空腔
                            </div>
                            {phase === 4 && (
                                <div className="legend-item" style={{ gridRow: 5, gridColumn: 2 }}>
                                    <div className="color-box" style={{ background: '#ff00ff' }}></div> Z軸 探針
                                </div>
                            )}
                        </div>
                    )}
                    <Canvas camera={{ position: [0, 0, 75], fov: 45 }}>
                        <color attach="background" args={['#030508']} />
                        <OrbitControls makeDefault />

                        {/* 1. 環境光 */}
                        <ambientLight intensity={0.6} />

                        {/* 2. 主光源 - 提供立體感，不會將表面照到發白 */}
                        <directionalLight position={[20, 20, 20]} intensity={1.5} />

                        {/* 3. 背面輪廓光 - 專門勾勒 SES 邊緣 */}
                        <directionalLight position={[-20, -10, -20]} intensity={0.8} color="#00f0ff" />

                        {/* 4. 頂部輔助光 - 柔和提亮整體 */}
                        <pointLight position={[0, 20, 0]} intensity={0.8} color="#ffffff" />

                        <Suspense fallback={null}>
                            <group position={[0, 0, 0]}>
                                {/* 統一呼叫的邊界框，在 Phase 2, 3, 4 顯示 */}
                                {bounds && (phase === 2 || phase === 3 || phase === 4) && (
                                    <group position={[bounds.cx, bounds.cy, bounds.cz]}>
                                        <boxHelper
                                            args={[new THREE.Mesh(new THREE.BoxGeometry(bounds.sizeX, bounds.sizeY, bounds.sizeZ))]}
                                            color="#ffee00"
                                            renderOrder={-1}
                                        />
                                    </group>
                                )}
                                {/* Phase 1, 2, 3: vdw */}
                                <AtomView
                                    atoms={data.atoms}
                                    visible={(phase === 1 && phase1Opts.vdw) || phase === 2 || phase === 3}
                                    dimmed={phase === 2 || phase === 3} />

                                {/* Phase 1: 探針 */}
                                <ProbeScannerView
                                    probePath={data.probe_path}
                                    visible={phase === 1}
                                    probeProgressRef={probeProgressRef} // 傳入 ref
                                />

                                {/* Phase 1,5: SES */}
                                <SESView
                                    visible={(phase === 1 && phase1Opts.ses) || phase === 5}
                                    probeProgressRef={probeProgressRef}
                                    phase={phase}
                                />
                                {/* Phase 2: 空間網格化 */}
                                <GridWireframe algoData={data.algo_data} atoms={data.atoms} visible={phase === 2} bounds={bounds} />
                                {/* Phase 3: 距離場掃描動畫 */}
                                <AlgorithmScanner algoData={data.algo_data} atoms={data.atoms} phase={phase} bounds={bounds} />
                                {/* Phase 4: 探針掃描動畫 */}
                                <ProbeScanner algoData={data.algo_data} phase={phase} />
                                {/* Phase 5: 口袋 Mesh 呈現 */}
                                {phase === 5 && (
                                    <PocketAnimationSequence
                                        algoData={data.algo_data}
                                        meshData={data.algo_data.pocket_mesh}
                                    />
                                )}
                            </group>
                        </Suspense>
                    </Canvas>
                </Boundary>
            );
        }
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
